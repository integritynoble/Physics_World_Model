[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "pwm-platform"
version = "0.1.0"
description = "PWM Platform — control plane, UI, and API for Physics World Model"
readme = {text = "PWM Platform", content-type = "text/plain"}
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PWM Contributors"}]
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Templates + UI
    "jinja2>=3.1.4",

    # Auth / security
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",

    # Redis + task queue
    "redis>=5.0.0",
    "arq>=0.26.0",

    # HTTP client (for SSO validation)
    "httpx>=0.27.0",

    # Settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",

    # Scientific computing / demo image generation
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pwm_platform"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
