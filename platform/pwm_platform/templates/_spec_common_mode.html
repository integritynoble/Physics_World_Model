{# Common Mode — select modality + algorithm → instant reconstruction #}
<div class="bg-white shadow rounded-lg p-6 space-y-6">
    <div>
        <h2 class="text-lg font-bold text-gray-900">Reconstruction</h2>
        <p class="text-sm text-gray-500">Select a modality and algorithm to run reconstruction on standard benchmark data.</p>
    </div>

    <form id="common-form" class="space-y-5" enctype="multipart/form-data">
        <!-- Modality + Algorithm selectors -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="common-modality" class="block text-sm font-medium text-gray-700 mb-1">Imaging Modality</label>
                <select id="common-modality" name="modality"
                        class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm py-2 px-3">
                    {% for cat, variants in grouped_variants.items() %}
                    <optgroup label="{{ cat | replace('_', ' ') | title }}">
                        {% for v in variants %}
                        <option value="{{ v.variant_key }}" {% if v.variant_key == preselect_modality %}selected{% endif %}>
                            {{ v.display_name }}
                        </option>
                        {% endfor %}
                    </optgroup>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="common-algorithm" class="block text-sm font-medium text-gray-700 mb-1">Algorithm</label>
                <select id="common-algorithm" name="algorithm"
                        class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm py-2 px-3">
                    {% if preselect_algorithms %}
                    {% for a in preselect_algorithms %}
                    <option value="{{ a.name }}" {% if a.name == preselect_algorithm %}selected{% endif %}>
                        {{ a.name }} ({{ a.type }})
                    </option>
                    {% endfor %}
                    {% else %}
                    <option value="">Select a modality first</option>
                    {% endif %}
                </select>
            </div>
        </div>

        <!-- Optional upload -->
        <details class="border border-gray-200 rounded-lg p-3">
            <summary class="text-sm font-medium text-indigo-600 cursor-pointer select-none">Use your own data instead</summary>
            <div class="mt-3 space-y-2">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Measurement data (.npy, .mat, .h5, .npz)</label>
                    <input type="file" name="measurement_file" accept=".npy,.mat,.h5,.npz"
                           class="block w-full text-sm text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" />
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Sensing matrix (optional)</label>
                    <input type="file" name="matrix_file" accept=".npy,.mat,.h5,.npz"
                           class="block w-full text-sm text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-gray-50 file:text-gray-600 hover:file:bg-gray-100" />
                </div>
            </div>
        </details>

        <!-- Reconstruct button -->
        <button type="button" id="common-reconstruct-btn"
                class="w-full px-6 py-3 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition-colors text-sm">
            Reconstruct
        </button>

        <!-- Loading spinner -->
        <div id="common-spinner" class="hidden flex items-center justify-center gap-2 py-4">
            <svg class="animate-spin h-5 w-5 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span class="text-sm text-gray-500">Running reconstruction...</span>
        </div>
    </form>

    <!-- Result area -->
    <div id="common-result"></div>
</div>

<script>
(function() {
    var modalityEl = document.getElementById('common-modality');
    var algorithmEl = document.getElementById('common-algorithm');
    var reconstructBtn = document.getElementById('common-reconstruct-btn');
    var spinner = document.getElementById('common-spinner');
    var resultDiv = document.getElementById('common-result');

    // Fetch algorithms when modality changes
    if (modalityEl) {
        modalityEl.addEventListener('change', function() {
            var vk = this.value;
            if (!vk) return;
            fetch('/api/v1/spec-chat/algorithms/' + encodeURIComponent(vk))
                .then(function(r) { return r.text(); })
                .then(function(html) { algorithmEl.innerHTML = html; });
        });
    }

    // Reconstruct button
    if (reconstructBtn) {
        reconstructBtn.addEventListener('click', function() {
            var form = document.getElementById('common-form');
            var formData = new FormData(form);

            spinner.classList.remove('hidden');
            resultDiv.innerHTML = '';
            reconstructBtn.disabled = true;
            reconstructBtn.textContent = 'Running...';

            fetch('/api/v1/spec-chat/reconstruct-common', {
                method: 'POST',
                body: formData,
            })
            .then(function(r) { return r.text(); })
            .then(function(html) {
                resultDiv.innerHTML = html;
            })
            .catch(function(err) {
                resultDiv.innerHTML = '<div class="p-4 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">Request failed: ' + err.message + '</div>';
            })
            .finally(function() {
                spinner.classList.add('hidden');
                reconstructBtn.disabled = false;
                reconstructBtn.textContent = 'Reconstruct';
            });
        });
    }
})();
</script>
