{# ── Interactive Spec Builder Chat ── #}
{% set _vk = chat_variant_key | default("sd_cassi") %}
<div class="bg-white shadow rounded-lg p-6 space-y-4 border-l-4 border-blue-400">

    <!-- Chat log -->
    <div id="chat-log" class="space-y-4 max-h-[500px] overflow-y-auto border border-gray-200 rounded-lg p-4 bg-gray-50 min-h-[120px]">
        <p class="text-sm text-gray-400 italic text-center py-8 chat-placeholder">
            Describe an imaging system to get started.
        </p>
    </div>

    <!-- Loading spinner -->
    <div id="chat-spinner" class="htmx-indicator flex items-center justify-center py-2">
        <svg class="animate-spin h-5 w-5 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="ml-2 text-sm text-gray-500">Thinking...</span>
    </div>

    <!-- Input area -->
    <form id="chat-form"
          hx-post="/api/v1/spec-chat/{{ _vk }}"
          hx-target="#chat-log"
          hx-swap="beforeend"
          hx-indicator="#chat-spinner"
          hx-on::before-request="var p=document.querySelector('#chat-log > .chat-placeholder'); if(p) p.remove();"
          hx-on::after-request="this.querySelector('textarea').value = ''; this.querySelector('textarea').focus();"
          class="space-y-3">

        <!-- Hidden session ID (updated by server responses) -->
        <input type="hidden" name="session_id" id="chat-session-id" value="">

        <!-- Message input + send -->
        <div class="flex gap-2">
            <textarea name="message" rows="2" required
                      placeholder="Describe an imaging system..."
                      class="flex-1 text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 resize-none"></textarea>
            <button type="submit"
                    class="self-end px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors flex-shrink-0">
                Send
            </button>
        </div>
    </form>
</div>
