{% extends "base.html" %}
{% block title %}New Run — PWM Platform{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold text-gray-900">New Run</h1>

    <form action="/api/v1/runs" method="post" hx-boost="false"
          class="bg-white shadow rounded-lg p-6 space-y-6">

        <!-- Input Mode -->
        <fieldset>
            <legend class="text-sm font-medium text-gray-700 mb-2">Input Mode</legend>
            <div class="space-y-2">
                <label class="flex items-center space-x-2">
                    <input type="radio" name="input_mode" value="spec" checked class="text-indigo-600">
                    <span class="text-sm text-gray-700">Experiment Spec (JSON/YAML)</span>
                </label>
                <label class="flex items-center space-x-2">
                    <input type="radio" name="input_mode" value="prompt" class="text-indigo-600">
                    <span class="text-sm text-gray-700">Natural Language Prompt</span>
                </label>
                <label class="flex items-center space-x-2">
                    <input type="radio" name="input_mode" value="measured" class="text-indigo-600">
                    <span class="text-sm text-gray-700">Measured Data</span>
                </label>
            </div>
        </fieldset>

        <!-- Modality -->
        <div>
            <label for="modality" class="block text-sm font-medium text-gray-700">Modality</label>
            <select name="modality" id="modality"
                    class="mt-1 block w-full pl-3 pr-10 py-2 text-base border border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                {% for m in modalities %}
                <option value="{{ m.modality_key }}">{{ m.display_name }} ({{ m.category }})</option>
                {% endfor %}
                {% if not modalities %}
                <option value="cassi">CASSI (spectral)</option>
                <option value="ct">CT (medical)</option>
                <option value="mri">MRI (medical)</option>
                <option value="ptychography">Ptychography (coherent)</option>
                {% endif %}
            </select>
        </div>

        <!-- Task Kind -->
        <div>
            <label for="task_kind" class="block text-sm font-medium text-gray-700">Task</label>
            <select name="task_kind" id="task_kind"
                    class="mt-1 block w-full pl-3 pr-10 py-2 text-base border border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                <option value="simulate_recon_analyze">Simulate + Reconstruct + Analyze</option>
                <option value="reconstruct_only">Reconstruct Only</option>
                <option value="calibrate_and_reconstruct">Calibrate & Reconstruct</option>
                <option value="fit_operator_only">Fit Operator Only</option>
                <option value="qc_report">QC Report</option>
            </select>
        </div>

        <!-- Experiment Spec -->
        <div>
            <label for="spec_json" class="block text-sm font-medium text-gray-700">
                Experiment Spec / Prompt
            </label>
            <textarea name="spec_json" id="spec_json" rows="8"
                      class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm font-mono"
                      placeholder='{"modality": "cassi", "sim": {"x_shape": [256, 256, 28]}} or a natural language prompt'></textarea>
        </div>

        <!-- Compute Mode -->
        <fieldset>
            <legend class="text-sm font-medium text-gray-700 mb-2">Compute</legend>
            <div class="flex space-x-4">
                <label class="flex items-center space-x-2">
                    <input type="radio" name="compute_mode" value="auto" checked class="text-indigo-600">
                    <span class="text-sm text-gray-700">Auto</span>
                </label>
                <label class="flex items-center space-x-2">
                    <input type="radio" name="compute_mode" value="cpu" class="text-indigo-600">
                    <span class="text-sm text-gray-700">CPU</span>
                </label>
                <label class="flex items-center space-x-2">
                    <input type="radio" name="compute_mode" value="gpu" class="text-indigo-600">
                    <span class="text-sm text-gray-700">GPU</span>
                </label>
            </div>
            <p class="mt-1 text-xs text-gray-500">Auto routes small jobs to CPU and large jobs to GPU.</p>
        </fieldset>

        <button type="submit"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            Submit Run
        </button>
    </form>
</div>
{% endblock %}
