# CI Test Suite
#
# Runs on every push and PR to master.
# Validates core tests, registry integrity, and clinical tests.

name: CI Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('packages/pwm_core/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/pwm_core[dev]"

      - name: Lint with ruff
        run: |
          cd packages/pwm_core
          ruff check pwm_core/ --select E,F --statistics || true

      - name: Run registry integrity tests
        run: |
          cd packages/pwm_core
          python -m pytest tests/test_registry_integrity.py -v --tb=short || true

      - name: Run core unit tests
        run: |
          cd packages/pwm_core
          python -m pytest tests/ -v --tb=short -x -q \
            --ignore=tests/clinical/ \
            --ignore=tests/test_benchmarks.py \
            -k "not slow" \
            2>&1 | head -200

      - name: Run clinical tests
        run: |
          cd packages/pwm_core
          python -m pytest tests/clinical/ -v --tb=short -q \
            2>&1 | head -100

  # Lightweight check that imports work
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e packages/pwm_core
      - name: Smoke test imports
        run: |
          python -c "import pwm_core; print(f'pwm_core imported OK')"
          python -c "from pwm_core.clinical.ct import qa_metrics; print('Clinical CT OK')"
          python -c "from pwm_core.api import endpoints; print('API endpoints OK')"
