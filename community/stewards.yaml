# -----------------------------------------------------------------------
# Governance rules for the steward board
# -----------------------------------------------------------------------

governance:
  min_stewards: 3
  max_stewards: 5
  term_years: 2
  max_consecutive_terms: 2
  mandatory_gap_years: 2
  min_institutions: 2
  min_countries: 2

  responsibilities:
    - Review all governance-lane PRs (touching graph/primitives.py, targeting/scoring.py, or frozen protocol definitions)
    - Vote on Rail Constitution changes per Article 3.2 (RFC + 90-day comment + unanimous vote)
    - Validate CISP challenge design, sealed data integrity, and results
    - Publish annual public report on rail health (scoring drift, safety brake triggers, community growth)
    - Mediate disputes between contributors and maintainers per GOVERNANCE.md Section 4

  vacancy_process:
    description: >
      If a steward resigns or is removed, the remaining stewards plus
      the core team appoint a replacement by majority vote within 60 days.
    deadline_days: 60
    vote_type: majority

  removal_process:
    description: >
      A steward may be removed for misconduct by majority vote of the
      remaining stewards. Removal requires documented evidence.
    vote_type: majority_of_remaining

  compensation:
    monetary: false
    co_authorship: true
    travel_support: true  # when funded
    acknowledgment: true

  staggered_rotation:
    description: >
      Terms are staggered so that no more than 2 stewards rotate in the
      same year. This ensures continuity of institutional knowledge.
    max_rotating_per_year: 2

