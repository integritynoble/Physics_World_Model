# Coded Lensless Imaging — a NEW system design
# Canonical chain: M -> C -> D
# Same chain as SIM but different physics: binary coded aperture + diffuser PSF
# Key advantage over plain lensless: mask adds measurement diversity, improves conditioning

modality: coded_lensless
display_name: Coded Lensless Imaging
category: computational_photography
carrier: photon
physics: incoherent_imaging
wave_model: ray
tier: 1

geometry:
  type: single_shot
  description: "Binary coded aperture placed between scene and bare sensor with diffuser"

key_parameters:
  wavelength_range_nm: [400, 700]
  object_distance_mm: 50
  mask_type: binary_random
  mask_fill_factor: 0.5
  mask_size: [256, 256]
  psf_type: diffuse_caustic
  psf_support_px: [256, 256]
  image_size: [256, 256]

sensor:
  type: bare_CMOS
  resolution: [256, 256]
  pixel_pitch_um: 5.5
  quantum_efficiency: 0.6
  well_depth_e: 15000
  bit_depth: 12
  read_noise_e: 3.0
  dark_current_e_per_s: 0.1

forward_elements:
  - id: source
    type: source
    name: Broadband LED
    parameters:
      wavelength_range_nm: [400, 700]
      power_mw: 100
      illumination: incoherent_flood

  - id: coded_aperture
    type: modulation
    name: Binary Coded Aperture
    parameters:
      type: binary_random
      fill_factor: 0.5
      pixel_pitch_um: 5.5
      size: [256, 256]
    mismatch:
      - type: mask_misalignment
        severity: medium
        description: "Lateral shift between mask and sensor"
        correction_method: cross_correlation_registration

  - id: diffuser
    type: optics
    name: Phase Diffuser
    parameters:
      type: diffuse_caustic
      psf_support_px: [256, 256]
      model: convolution
    mismatch:
      - type: psf_calibration_error
        severity: medium
        description: "Measured PSF differs from true PSF"
        correction_method: in_situ_point_source_calibration
      - type: depth_dependent_psf
        severity: low
        description: "PSF varies with object distance"
        correction_method: depth_sectioned_reconstruction

  - id: detector
    type: detector
    name: Bare CMOS Sensor
    parameters:
      pixels: [256, 256]
      pixel_pitch_um: 5.5
      quantum_efficiency: 0.6
    noise:
      - type: poisson
        parameters: {mean_photons: 5000}
      - type: gaussian
        parameters: {sigma_electrons: 3.0}

  - id: adc
    type: digitization
    name: 12-bit ADC
    parameters:
      bit_depth: 12

forward_model:
  equation: "y = H_psf * (M ⊙ x) + n"
  description: "Measurement is the diffuser-convolved coded image plus noise"
  canonical_chain: "M -> C -> D"
  measurement_shape: "(256, 256)"

noise_model:
  type: "Poisson(H_psf * (M ⊙ x)) + N(0, σ²)"
  dominant: shot_noise

system_elements:
  source:
    type: broadband_led
    power_mw: 100
    spectral_range_nm: [400, 700]
  optics:
    - primitive: M
      element: binary_coded_aperture
      specs:
        type: binary_random
        fill_factor: 0.5
        pixel_pitch_um: 5.5
        fabrication_tolerance: 0.5um
    - primitive: C
      element: phase_diffuser
      specs:
        type: diffuse_caustic
        psf_support_px: [256, 256]
  detector:
    type: bare_CMOS
    pixel_size_um: 5.5
    resolution: [256, 256]
    quantum_efficiency: 0.6
    read_noise_e: 3.0
    dark_current_e_per_s: 0.1
  calibration:
    parameters:
      - name: mask_alignment
        tolerance: 0.5px
        sensitivity: 8.0dB/px
        correction_method: cross_correlation
        correction_frequency: per_session
      - name: psf_calibration
        tolerance: 2%
        sensitivity: 1.5dB/%
        correction_method: point_source_calibration
        correction_frequency: per_session
    autonomous_recovery_rate: 0.88

algorithms:
  classical:
    - name: wiener_deconv
      type: direct
      description: "Wiener deconvolution in FFT domain with known mask and PSF"
    - name: fista_tv
      type: iterative
      description: "FISTA with TV regularization for coded lensless"
    - name: admm_tikhonov
      type: iterative
      description: "ADMM with Tikhonov regularization"
    - name: pnp_admm_tv
      type: plug_and_play
      description: "PnP-ADMM with TV denoiser"
    - name: richardson_lucy
      type: iterative
      description: "Richardson-Lucy deconvolution adapted for coded measurement"
