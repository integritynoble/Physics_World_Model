modality_id: holography
display_name: Digital Holographic Microscopy
category: Coherent Imaging
carrier: Photon
maturity: M1
variants:
  offaxis_dhm:
    id: offaxis_dhm
    name: Off-axis DHM
    dag: Src(HeNe_633nm) -> P(sample) + P(ref_tilted_3deg) -> Sigma(interference) -> D(CCD)
    optical_elements:
    - HeNe laser (633 nm)
    - Sample arm
    - Tilted reference beam (3 deg)
    - CCD (interference)
    reference: Single-shot; carrier frequency separation
  inline_gabor:
    id: inline_gabor
    name: In-line (Gabor) Holography
    dag: Src(laser) -> P(sample) -> D(CCD)
    optical_elements:
    - Laser source
    - Sample (in-line)
    - CCD (no separate reference)
    reference: Coaxial; twin image artifact
  lensless_dhm:
    id: lensless_dhm
    name: Lensless DHM (DLHM)
    dag: Src(point_source) -> P(Fresnel) -> D(CCD_no_lens)
    optical_elements:
    - Point source (LED or fiber)
    - Free-space Fresnel propagation
    - Bare CCD sensor (no lens)
    reference: No objective; long working distance
  electron_holography:
    id: electron_holography
    name: Electron Holography
    dag: Src(e_gun) -> P(biprism) -> D(CCD)
    optical_elements:
    - Electron gun (TEM)
    - Electrostatic biprism
    - CCD
    reference: Electric/magnetic field measurement
image_sizes:
  small:
    x_shape:
    - 128
    - 128
    label: Small
  standard:
    x_shape:
    - 256
    - 256
    label: Standard
  large:
    x_shape:
    - 512
    - 512
    label: Large
noise_levels:
  clean:
    label: Clean
    snr_db: 60
  low:
    label: Low noise
    snr_db: 40
  medium:
    label: Medium noise
    snr_db: 30
  high:
    label: High noise
    snr_db: 20
mismatch_params:
- name: Reference angle error
  nominal: 0.0
  range:
  - -1.0
  - 1.0
  unit: deg
- name: Carrier frequency error
  nominal: 0.0
  range:
  - -5.0
  - 5.0
  unit: '-'
- name: Vibration
  nominal: 0.0
  range:
  - 0.0
  - 10.0
  unit: '-'
mismatch_levels:
  M0_nominal:
    description: No mismatch - perfect forward model
    n_params_perturbed: 0
  M1_single:
    description: Single parameter perturbed
    n_params_perturbed: 1
  M2_compound:
    description: 3+ parameters simultaneously perturbed
    n_params_perturbed: 3
  M3_real:
    description: Real calibration/experimental errors
    n_params_perturbed: all
  M4_adversarial:
    description: Worst-case mismatch optimized to max failure
    n_params_perturbed: all
data_sources:
- id: sipi_offaxis
  type: web
  label: WEB
  url: https://sipi.usc.edu/database/
  citation: Weber, The USC-SIPI Image Database, 1997
  license: Public domain
  applies_to: all_variants
- id: holography_generated
  type: generated
  label: GEN
  description: Synthetically generated holography data
  applies_to: all_variants
