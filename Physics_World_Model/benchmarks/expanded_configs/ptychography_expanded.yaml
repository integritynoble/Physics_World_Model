modality_id: ptychography
display_name: Ptychographic Imaging
category: Coherent Imaging
carrier: Electron/Photon
maturity: M3
variants:
  farfield_xray:
    id: farfield_xray
    name: Far-field X-ray Ptychography
    dag: Src(synchrotron_10keV) -> M(probe) -> P(Fresnel) -> D(CCD_2048)
    optical_elements:
    - Synchrotron X-ray (10 keV)
    - Focused probe (zone plate)
    - Area detector (2048x2048)
    reference: PtychoNN benchmark
  nearfield_ptycho:
    id: nearfield_ptycho
    name: Near-field Ptychography
    dag: Src(synchrotron) -> M(probe) -> P(Fresnel_short) -> D(CCD)
    optical_elements:
    - Synchrotron source
    - Probe
    - Short propagation distance
    - Detector
    reference: Relaxed overlap; Fresnel zone
  bragg_ptycho:
    id: bragg_ptycho
    name: Bragg Ptychography
    dag: Src(synchrotron) -> M(crystal_probe) -> R(Bragg) -> D(CCD)
    optical_elements:
    - Synchrotron source
    - Focused probe
    - Crystal sample at Bragg angle
    - Area detector
    reference: 3D strain mapping
  electron_ptycho:
    id: electron_ptycho
    name: Electron Ptychography (4D-STEM)
    dag: Src(e_gun_200keV) -> M(STEM_probe) -> P(elastic_scatter) -> D(pixelated_256x256)
    optical_elements:
    - Electron gun (200 keV)
    - STEM probe
    - Pixelated detector (256x256)
    reference: '4D dataset: scan(x,y) + diff(kx,ky)'
image_sizes:
  small:
    x_shape:
    - 128
    - 128
    label: Small
  standard:
    x_shape:
    - 256
    - 256
    label: Standard
  large:
    x_shape:
    - 512
    - 512
    label: Large
noise_levels:
  clean:
    label: Clean
    snr_db: 60
  low:
    label: Low noise
    snr_db: 40
  medium:
    label: Medium noise
    snr_db: 30
  high:
    label: High noise
    snr_db: 20
mismatch_params:
- name: Probe position error
  nominal: 0.0
  range:
  - -5.0
  - 5.0
  unit: px
- name: Defocus
  nominal: 0.0
  range:
  - -50.0
  - 50.0
  unit: nm
- name: Partial coherence
  nominal: 1.0
  range:
  - 0.7
  - 1.0
  unit: '-'
mismatch_levels:
  M0_nominal:
    description: No mismatch - perfect forward model
    n_params_perturbed: 0
  M1_single:
    description: Single parameter perturbed
    n_params_perturbed: 1
  M2_compound:
    description: 3+ parameters simultaneously perturbed
    n_params_perturbed: 3
  M3_real:
    description: Real calibration/experimental errors
    n_params_perturbed: all
  M4_adversarial:
    description: Worst-case mismatch optimized to max failure
    n_params_perturbed: all
data_sources:
- id: ptychonn_benchmark
  type: web
  label: WEB
  url: https://github.com/mcherukara/PtychoNN/tree/master/data
  citation: Cherukara et al., AI-enabled high-resolution scanning coherent diffraction imaging, Applied Physics Letters 2020
  license: BSD-2-Clause
  applies_to: all_variants
- id: ptychography_generated
  type: generated
  label: GEN
  description: Synthetically generated ptychography data
  applies_to: all_variants
total_cases:
  B1: 48
  B2: 240
  B3: 240
  B4: 240
  grand_total: 768
