modality_id: dark_field
display_name: Dark-Field Microscopy
category: Microscopy
canonical_dag: C --> D
carrier: Photon
maturity: M0
forward_model_type: linear_operator
default_solver: richardson_lucy
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: dark_field
has_dedicated_operator: true
graph_template_id: dark_field_graph_v1
theta:
  sigma: 2.0
  read_noise_e: 5.0
  pixel_size_um: 6.5
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: talbot_darkfield_dataset
  dataset_url: https://doi.org/10.1038/nphys967
  fallback: generated
  synthetic_generator: cell_phantom
  citation: Pfeiffer, F. et al. (2008) Hard-X-ray dark-field imaging, Nature Physics
    4:949
  license: Research use
mismatch_params:
- name: Condenser NA vs objective NA ratio
  nominal: 1.2
  range:
  - 1.0
  - 1.5
  unit: '-'
- name: Stray light
  nominal: 0.0
  range:
  - 0.0
  - 5.0
  unit: relative
- name: Scattering angle range
  nominal: 0.0
  range:
  - 0
  - 0
  unit: '-'
solvers:
  traditional_cpu:
    name: Richardson-Lucy
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: CARE
    module: pwm_core.recon.care_unet
    function: run_care
    params: 2M
    gpu: true
    reference: Weigert et al. 2018
  df_unet:
    name: DF-UNet
    module: pwm_core.recon.darkfield_solvers
    function: df_unet_recon
    params: 31M
    gpu: true
    reference: Wolfer, T. et al. (2021) DL for dark-field X-ray CT, Sci. Rep. 11:5005
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / dark_field_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
