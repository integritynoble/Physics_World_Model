modality_id: pet
display_name: Positron Emission Tomography (PET)
category: Medical Imaging
canonical_dag: Pi --> D
carrier: Gamma
maturity: M1
forward_model_type: linear_operator
default_solver: mlem
tier: A
x_shape:
- 128
- 128
y_shape:
- 180
- 128
operator_id: pet
has_dedicated_operator: true
graph_template_id: pet_graph_v2
theta:
  isotope: F-18
  half_life_min: 109.77
  activity_mbq: 370
  mean_attenuation_coefficient: 0.096
  n_rings: 4
  n_detectors_per_ring: 512
  crystal: LYSO
  timing_resolution_ps: 300
assets: {}
category_module: medical_ct_radon
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: brainweb_pet
  dataset_url: https://brainweb.bic.mni.mcgill.ca/brainweb/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: 'Cocosco et al., BrainWeb: Online Interface to a 3D MRI Simulated Brain
    Database, NeuroImage 1997'
  license: Research use
mismatch_params:
- name: Attenuation map error
  nominal: 0.0
  range:
  - 0.0
  - 10.0
  unit: HU-to-LAC
- name: Scatter fraction
  nominal: 0.35
  range:
  - 0.2
  - 0.5
  unit: '-'
- name: Randoms fraction
  nominal: 0.2
  range:
  - 0.1
  - 0.4
  unit: '-'
- name: Normalization error
  nominal: 0.0
  range:
  - 0.0
  - 5.0
  unit: '-'
- name: TOF timing offset
  nominal: 0.0
  range:
  - -200.0
  - 200.0
  unit: ps
solvers:
  traditional_cpu:
    name: FBP (emission tomography)
    module: pwm_core.recon.ct_solvers
    function: run_fbp
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: NeuroLF-PET
    module: pwm_core.recon.pet_solvers
    function: neurolF_pet_recon
    params: 30M
    gpu: true
    reference: 'Häggström, I. et al. (2019) DeepPET: DL for PET reconstruction, Med.
      Image Anal. 58'
  famous_dl:
    name: PET-DL (U-Net)
    module: pwm_core.recon.pet_solvers
    function: pet_unet_recon
    params: 31M
    gpu: true
    reference: Gong, K. et al. (2019) PET image reconstruction with DL, IEEE TMI 38(9)
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: 'Cocosco et al., BrainWeb: Online Interface to a 3D MRI Simulated Brain
      Database, NeuroImage 1997'
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / pet_graph_v2
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
