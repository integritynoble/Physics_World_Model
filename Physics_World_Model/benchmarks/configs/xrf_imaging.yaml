modality_id: xrf_imaging
display_name: X-ray Fluorescence (XRF) Imaging
category: Industrial Inspection
canonical_dag: M --> R --> D
carrier: X-ray
maturity: M0
forward_model_type: nonlinear_operator
default_solver: element_quantification
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: xrf_imaging
has_dedicated_operator: true
graph_template_id: xrf_imaging_graph_v1
theta:
  density: 0.5
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: xrf_dataset
  dataset_url: https://www.aps.anl.gov/Science/Scientific-Software/XRF-Maps
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Vogt et al., APS XRF Maps
  license: Public domain
mismatch_params:
- name: Excitation energy drift
  nominal: 0.0
  range:
  - -0.05
  - 0.05
  unit: keV
- name: Detector resolution
  nominal: 130.0
  range:
  - 120.0
  - 150.0
  unit: eV
- name: Matrix absorption
  nominal: 1.0
  range:
  - 0.85
  - 1.15
  unit: '-'
- name: Beam spot size
  nominal: 1.0
  range:
  - 0.5
  - 2.0
  unit: um
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  xrf_dl:
    name: XRF-Net [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 75
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: Vogt et al., APS XRF Maps
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / xrf_imaging_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
