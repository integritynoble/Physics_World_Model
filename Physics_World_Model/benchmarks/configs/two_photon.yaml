  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / two_photon_graph_v2
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
