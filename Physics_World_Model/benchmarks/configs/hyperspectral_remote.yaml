modality_id: hyperspectral_remote
display_name: Hyperspectral Remote Sensing
category: Remote Sensing
canonical_dag: M --> W --> Sigma --> D
carrier: Photon
maturity: M0
forward_model_type: linear_operator
default_solver: spectral_unmixing
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: hyperspectral_remote
has_dedicated_operator: true
graph_template_id: hyperspectral_remote_graph_v1
theta:
  density: 0.5
assets: {}
category_module: compressive_mask
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: sentinel
  dataset_url: https://scihub.copernicus.eu/
  fallback: generated
  synthetic_generator: spectral_scene
  citation: Copernicus Sentinel-2
  license: CC-BY-SA-3.0
mismatch_params:
- name: Spectral shift
  nominal: 0.0
  range:
  - -2.0
  - 2.0
  unit: nm
- name: Smile distortion
  nominal: 0.0
  range:
  - -1.0
  - 1.0
  unit: px
- name: Keystone distortion
  nominal: 0.0
  range:
  - -0.5
  - 0.5
  unit: px
- name: Radiometric gain
  nominal: 1.0
  range:
  - 0.9
  - 1.1
  unit: '-'
solvers:
  traditional_cpu:
    name: RDA [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: SAR-DL [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: &id001
      iters: 75
    gpu: false
    reference: Richardson 1972, JOSA
  hyper_dl:
    name: SST-USRNet [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: *id001
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  - sam
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: Copernicus Sentinel-2
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / hyperspectral_remote_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
