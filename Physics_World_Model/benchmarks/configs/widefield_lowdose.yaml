  - 500.0
  unit: photons/px
- name: Read noise sigma
  nominal: 5.0
  range:
  - 1.0
  - 15.0
  unit: e-
- name: Background
  nominal: 50.0
  range:
  - 10.0
  - 200.0
  unit: counts
- name: Dark current
  nominal: 0.1
  range:
  - 0.01
  - 1.0
  unit: e-/px/s
solvers:
