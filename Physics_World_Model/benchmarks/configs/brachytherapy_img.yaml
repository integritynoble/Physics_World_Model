modality_id: brachytherapy_img
display_name: Brachytherapy Imaging
category: Medical Imaging
canonical_dag: Pi --> D
carrier: Gamma/X-ray
maturity: M0
forward_model_type: nonlinear_operator
default_solver: tg43_dose
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: brachytherapy_img
has_dedicated_operator: true
graph_template_id: brachytherapy_img_graph_v1
theta:
  n_angles: 180
  pixel_size_um: 50.0
assets: {}
category_module: medical_ct_radon
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: brachytherapy_seed_dataset
  dataset_url: https://www.aapm.org/pubs/reports/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Rivard, M.J. et al. (2004) Update of AAPM Task Group No. 43 Report, Med.
    Phys.
  license: Research use
mismatch_params:
- name: Source position error
  nominal: 0.0
  range:
  - -2.0
  - 2.0
  unit: mm
- name: Attenuation coefficient
  nominal: 0.2
  range:
  - 0.15
  - 0.25
  unit: 1/cm
- name: Detector gain drift
  nominal: 1.0
  range:
  - 0.95
  - 1.05
  unit: '-'
- name: Scatter fraction
  nominal: 0.15
  range:
  - 0.1
  - 0.25
  unit: '-'
solvers:
  traditional_cpu:
    name: FBP [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: DL-Recon [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  brachy_dl:
    name: BrachyNet [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 75
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / brachytherapy_img_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
