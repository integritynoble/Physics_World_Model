- name: Ion suppression (matrix effect)
  nominal: 0.0
  range:
  - 0.0
  - 50.0
  unit: '-'
- name: Spatial resolution degradation
  nominal: 0.0
  range:
  - 0.0
  - 50.0
  unit: '-'
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  desi_dl:
    name: DESI-SegNet [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 75
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
