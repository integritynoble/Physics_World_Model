modality_id: spect
display_name: Single Photon Emission CT (SPECT)
category: Medical Imaging
canonical_dag: Pi --> D
carrier: Gamma
maturity: M0
forward_model_type: linear_operator
default_solver: mlem
tier: A
x_shape:
- 128
- 128
y_shape:
- 120
- 128
operator_id: spect
has_dedicated_operator: true
graph_template_id: spect_graph_v2
theta:
  isotope: Tc-99m
  half_life_hr: 6.0
  activity_mbq: 740
  gamma_energy_kev: 140
  hole_diameter_mm: 1.5
  septal_thickness_mm: 0.2
  hole_length_mm: 25
  crystal_thickness_mm: 9.5
  pixel_size_mm: 4.4
  energy_resolution_percent: 10
assets: {}
category_module: medical_ct_radon
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: zubal_spect
  dataset_url: http://noodle.med.yale.edu/zubal/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Zubal et al., Computerized three-dimensional segmented human anatomy,
    Medical Physics 1994
  license: Research use
mismatch_params:
- name: Collimator response error
  nominal: 0.0
  range:
  - 0.0
  - 20.0
  unit: '-'
- name: Center-of-rotation
  nominal: 0.0
  range:
  - -3.0
  - 3.0
  unit: px
- name: Attenuation error
  nominal: 0.0
  range:
  - 0.0
  - 15.0
  unit: relative
solvers:
  traditional_cpu:
    name: FBP (emission tomography)
    module: pwm_core.recon.ct_solvers
    function: run_fbp
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: SPECT-DL (OSEM+)
    module: pwm_core.recon.spect_solvers
    function: spect_dl_recon
    params: 20M
    gpu: true
    reference: Shiri, I. et al. (2020) Deep-JASC DL SPECT, Eur. J. Nucl. Med. Mol.
      Imaging
  famous_dl:
    name: SPECT-UNet
    module: pwm_core.recon.spect_solvers
    function: spect_unet_recon
    params: 31M
    gpu: true
    reference: Kim, K. et al. (2018) Penalized PET reconstruction using DL, IEEE TMI
      37(6)
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: Zubal et al., Computerized three-dimensional segmented human anatomy,
      Medical Physics 1994
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / spect_graph_v2
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
