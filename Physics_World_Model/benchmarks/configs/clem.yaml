modality_id: clem
display_name: Correlative Light-Electron Microscopy (CLEM)
category: Multi-Modal Fusion
canonical_dag: C --> D (LM) + C --> D (EM) --> Fusion
carrier: Photon
maturity: M0
forward_model_type: nonlinear_operator
default_solver: overlay_registration
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: clem
has_dedicated_operator: true
graph_template_id: clem_graph_v1
theta:
  sigma: 2.0
  read_noise_e: 5.0
  pixel_size_um: 6.5
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: clem_yeast_dataset
  dataset_url: https://www.ebi.ac.uk/empiar/EMPIAR-10094/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Bharat, T.A.M. et al. (2018) CLEM of HIV-1 budding, Nature Methods 15:621
  license: CC0 (EMPIAR)
mismatch_params:
- name: Registration error (LM to EM)
  nominal: 0.0
  range:
  - 0.0
  - 500.0
  unit: nm
- name: Sample deformation (fixation)
  nominal: 0.0
  range:
  - 0.0
  - 5.0
  unit: shrinkage
- name: Fluorescence preservation
  nominal: 100.0
  range:
  - 30.0
  - 100.0
  unit: '-'
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  clem_dl:
    name: CLEM-Net [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 75
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / clem_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
