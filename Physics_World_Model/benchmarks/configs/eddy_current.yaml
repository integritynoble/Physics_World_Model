modality_id: eddy_current
display_name: Eddy Current Imaging
category: Industrial Inspection
canonical_dag: F --> D
carrier: EM
maturity: M0
forward_model_type: nonlinear_operator
default_solver: impedance_inversion
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: eddy_current
has_dedicated_operator: true
graph_template_id: eddy_current_graph_v1
theta:
  acceleration: 4
assets: {}
category_module: medical_mri_kspace
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: ect_defect_dataset
  dataset_url: https://www.ndt.net/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Sophian, A. et al. (2001) A feature extraction technique based on PCA
    for eddy current NDT, NDT&E Int.
  license: Research use
mismatch_params:
- name: Liftoff distance
  nominal: 0.0
  range:
  - 0.0
  - 1.0
  unit: mm
- name: Conductivity error
  nominal: 58.0
  range:
  - 55.0
  - 61.0
  unit: MS/m
- name: Excitation frequency drift
  nominal: 100.0
  range:
  - 95.0
  - 105.0
  unit: kHz
- name: Probe tilt
  nominal: 0.0
  range:
  - -2.0
  - 2.0
  unit: deg
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: &id001
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  ec_dl:
    name: ECT-Net [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: *id001
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / eddy_current_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
