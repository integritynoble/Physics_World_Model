# Temporal-Coded Lensless Video — a NEW system design
# Canonical chain: M -> C -> Sigma -> D
# Combines CACTI-style temporal coding with lensless imaging (no lens)
# Key insight: temporal mask coding + diffuser PSF + frame accumulation
# Recovers T video frames from a single coded lensless measurement

modality: temporal_coded_lensless
display_name: Temporal-Coded Lensless Video
category: computational_photography
carrier: photon
physics: incoherent_imaging
wave_model: ray
tier: 1

geometry:
  type: single_shot_temporal
  description: "T temporally-coded frames accumulated through a diffuser into one measurement"

key_parameters:
  wavelength_range_nm: [400, 700]
  object_distance_mm: 50
  n_frames: 8
  mask_type: binary_temporal
  psf_type: diffuse_caustic
  psf_support_px: [256, 256]
  image_size: [256, 256]

sensor:
  type: bare_CMOS
  resolution: [256, 256]
  pixel_pitch_um: 5.5
  quantum_efficiency: 0.6
  well_depth_e: 15000
  bit_depth: 12
  read_noise_e: 3.0

forward_elements:
  - id: source
    type: source
    name: Broadband LED
    parameters:
      wavelength_range_nm: [400, 700]
      power_mw: 100
      illumination: incoherent_flood

  - id: temporal_mask
    type: modulation
    name: Temporal Binary Mask
    parameters:
      type: binary_temporal
      n_frames: 8
      fill_factor: 0.5
      modulation_rate_hz: 1000
    mismatch:
      - type: temporal_jitter
        severity: medium
        description: "Timing uncertainty in mask switching"
        correction_method: synchronization_calibration
      - type: mask_pattern_error
        severity: low
        description: "Actual mask pattern deviates from design"
        correction_method: measurement_based_calibration

  - id: diffuser
    type: optics
    name: Phase Diffuser
    parameters:
      type: diffuse_caustic
      psf_support_px: [256, 256]
      model: convolution
    mismatch:
      - type: psf_calibration_error
        severity: medium
        description: "Measured PSF differs from true PSF"
        correction_method: in_situ_point_source_calibration

  - id: accumulator
    type: processing
    name: Temporal Accumulation
    parameters:
      type: sum
      n_frames: 8
      description: "Detector integrates all T coded frames into one exposure"

  - id: detector
    type: detector
    name: Bare CMOS Sensor
    parameters:
      pixels: [256, 256]
      pixel_pitch_um: 5.5
      quantum_efficiency: 0.6
    noise:
      - type: poisson
        parameters: {mean_photons: 3000}
      - type: gaussian
        parameters: {sigma_electrons: 3.0}

  - id: adc
    type: digitization
    name: 12-bit ADC
    parameters:
      bit_depth: 12

forward_model:
  equation: "y = sum_t H_psf * (m_t ⊙ x_t) + n"
  description: "Measurement is sum of T diffuser-convolved temporally-coded frames plus noise"
  canonical_chain: "M -> C -> Sigma -> D"
  measurement_shape: "(256, 256)"
  object_shape: "(8, 256, 256)"

noise_model:
  type: "Poisson(sum_t H_psf * (m_t ⊙ x_t)) + N(0, σ²)"
  dominant: shot_noise

system_elements:
  source:
    type: broadband_led
    power_mw: 100
    spectral_range_nm: [400, 700]
  optics:
    - primitive: M
      element: dmd_temporal_modulator
      specs:
        type: binary_temporal
        n_frames: 8
        switching_rate_hz: 1000
        fill_factor: 0.5
    - primitive: C
      element: phase_diffuser
      specs:
        type: diffuse_caustic
        psf_support_px: [256, 256]
  detector:
    type: bare_CMOS
    pixel_size_um: 5.5
    resolution: [256, 256]
    quantum_efficiency: 0.6
    read_noise_e: 3.0
  calibration:
    parameters:
      - name: temporal_synchronization
        tolerance: 0.1ms
        sensitivity: 2.0dB/ms
        correction_method: trigger_calibration
        correction_frequency: per_session
      - name: psf_calibration
        tolerance: 2%
        sensitivity: 1.5dB/%
        correction_method: point_source_calibration
        correction_frequency: per_session
      - name: mask_pattern
        tolerance: 1%
        sensitivity: 0.5dB/%
        correction_method: direct_measurement
        correction_frequency: per_fabrication
    autonomous_recovery_rate: 0.86

algorithms:
  classical:
    - name: wiener_deconv
      type: direct
      description: "Wiener deconvolution treating H = [H_psf*diag(m_1); ...; H_psf*diag(m_T)]"
    - name: gap_tv
      type: iterative
      description: "GAP-TV (Generalized Alternating Projection with TV)"
    - name: fista_tv
      type: iterative
      description: "FISTA with TV regularization for video recovery"
    - name: pnp_admm_tv
      type: plug_and_play
      description: "PnP-ADMM with TV denoiser for temporal-coded lensless"
    - name: admm_tikhonov
      type: iterative
      description: "ADMM with Tikhonov regularization"
