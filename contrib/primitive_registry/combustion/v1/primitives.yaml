# Combustion Primitive Registry v1
# Domain-specific primitives for reactive flow simulation and diagnostics.
description: "Combustion physics primitives for reactive flow simulation"
domain: combustion
version: v1

primitives:
  - name: ReactiveTransport
    symbol: Rt
    scope: "Coupled species transport with chemical reactions"
    decomposition: ["general/v1/Compose", "general/v1/Differentiate"]

  - name: ChemicalKinetics
    symbol: Ck
    scope: "Reaction rate computation (Arrhenius, detailed mechanism)"
    decomposition: ["general/v1/Transform", "general/v1/Stochastize"]

  - name: TurbulenceModel
    symbol: Tm
    scope: "Sub-grid turbulence modeling (LES, RANS, DNS)"
    decomposition: ["general/v1/Transform", "general/v1/Regularize"]

  - name: HeatTransfer
    symbol: Ht
    scope: "Conduction, convection, radiation heat transfer"
    decomposition: ["general/v1/Differentiate", "general/v1/Reduce"]

  - name: MeshAdaptation
    symbol: Ma
    scope: "Adaptive mesh refinement based on solution gradients"
    decomposition: ["general/v1/Discretize", "general/v1/Validate"]
