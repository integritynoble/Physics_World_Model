# Particle Physics Primitive Registry v1
# Domain-specific primitives for detector simulation and event reconstruction.
description: "Particle physics primitives for detector simulation and event reconstruction"
domain: particle_physics
version: v1

primitives:
  - name: ParticleTracking
    symbol: Pt
    scope: "Charged particle trajectory through magnetic/electric fields"
    decomposition: ["general/v1/Transform", "general/v1/Differentiate"]

  - name: CalorimeterResponse
    symbol: Cr
    scope: "Energy deposition and shower development in calorimeters"
    decomposition: ["general/v1/Reduce", "general/v1/Stochastize"]

  - name: EventReconstruction
    symbol: Er
    scope: "Reconstruct particle kinematics from detector hits"
    decomposition: ["general/v1/Invert", "general/v1/Compose"]

  - name: PileupCorrection
    symbol: Pc
    scope: "Correct for overlapping collision events"
    decomposition: ["general/v1/Regularize", "general/v1/Reduce"]

  - name: JetClustering
    symbol: Jc
    scope: "Cluster detector hits into particle jets"
    decomposition: ["general/v1/Reduce", "general/v1/Validate"]
