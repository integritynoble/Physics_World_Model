# Particle Physics -> General primitive cross-domain mappings
source_registry: "particle_physics/v1"
target_registry: "general/v1"

mappings:
  - source: "ParticleTracking"
    target: ["general/v1/Transform", "general/v1/Differentiate"]
    notes: "Lorentz force trajectory is a coordinate Transform with ODE Differentiate"

  - source: "CalorimeterResponse"
    target: ["general/v1/Reduce", "general/v1/Stochastize"]
    notes: "Energy deposition is a Reduce (sum) with shower Stochastize (fluctuations)"

  - source: "EventReconstruction"
    target: ["general/v1/Invert", "general/v1/Compose"]
    notes: "Kinematic fitting Inverts the detector response and Composes track segments"

  - source: "PileupCorrection"
    target: ["general/v1/Regularize", "general/v1/Reduce"]
    notes: "Pileup subtraction is a Regularize (prior on single-event) plus Reduce (average)"

  - source: "JetClustering"
    target: ["general/v1/Reduce", "general/v1/Validate"]
    notes: "Anti-kT clustering Reduces hits into jets then Validates jet criteria"
