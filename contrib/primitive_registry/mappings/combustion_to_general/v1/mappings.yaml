# Combustion -> General Primitive Mappings v1
schema_version: "1.0"
source_registry: combustion/v1
target_registry: general/v1
version: v1

mappings:
  - source: ReactiveTransport
    decomposes_into: [Compose, Differentiate]
    notes: Coupled transport+reaction is operator Compose with PDE Differentiate

  - source: ChemicalKinetics
    decomposes_into: [Transform, Stochastize]
    notes: Arrhenius rate law is a nonlinear Transform; stochastic for Monte Carlo kinetics

  - source: TurbulenceModel
    decomposes_into: [Transform, Regularize]
    notes: Sub-grid model is a coarse-graining Transform with closure Regularize

  - source: HeatTransfer
    decomposes_into: [Differentiate, Reduce]
    notes: Heat equation involves spatial Differentiate and boundary-integral Reduce

  - source: MeshAdaptation
    decomposes_into: [Discretize, Validate]
    notes: AMR re-Discretizes the domain and Validates solution gradient criteria
