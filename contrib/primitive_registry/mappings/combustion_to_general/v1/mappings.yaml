schema_version: "1.0"
source_registry: combustion/v1
target_registry: general/v1
version: v1

mappings:
  - source: Advect
    decomposes_into: [Transform, Compose]
    notes: Advection = spatial Transform (upwind) + time-step Compose

  - source: Diffuse
    decomposes_into: [Convolve, Differentiate]
    notes: Diffusion = spatial Convolve (Gaussian kernel) + implicit Differentiate

  - source: React
    decomposes_into: [Stochastize, Differentiate]
    notes: Reaction ODE = stiff Differentiate + Stochastize (Monte Carlo kinetics)

  - source: Radiate
    decomposes_into: [Propagate, Attenuate]
    notes: Radiative transfer = photon Propagate + medium Attenuate

  - source: Pressure_Solve
    decomposes_into: [Invert, Differentiate]
    notes: Pressure Poisson = Invert (linear system) of Differentiate (Laplacian)

  - source: Turbulent_Mix
    decomposes_into: [Stochastize, Compose]
    notes: Turbulence closure = Stochastize (subgrid) + Compose with momentum
