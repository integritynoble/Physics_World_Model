# Remote Sensing -> General Primitive Mappings v1
schema_version: "1.0"
source_registry: remote_sensing/v1
target_registry: general/v1
version: v1

mappings:
  - source: AtmosphericCorrection
    decomposes_into: [Transform, Regularize]
    notes: Atmospheric removal is a radiative-transfer Transform with smoothness Regularize

  - source: SpectralUnmixing
    decomposes_into: [Invert, Regularize]
    notes: Unmixing Inverts the linear mixture model with abundance Regularize

  - source: PanSharpening
    decomposes_into: [Compose, Transform]
    notes: Pan-sharpening Composes high-res pan with multispectral via injection Transform

  - source: GeometricCorrection
    decomposes_into: [Transform, Discretize]
    notes: Orthorectification is a geometric Transform onto a Discretize-d output grid

  - source: ChangeDetection
    decomposes_into: [Differentiate, Validate]
    notes: Temporal differencing Differentiates multi-date images then Validates change map

  - source: SARInterferometry
    decomposes_into: [Transform, Compose, Reduce]
    notes: InSAR phase = complex conjugate Compose of two SAR Transform-s then phase Reduce
