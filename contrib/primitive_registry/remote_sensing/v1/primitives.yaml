# Remote Sensing Primitive Registry v1
# Domain-specific primitives for satellite/aerial imaging and spectral analysis.
description: "Remote sensing primitives for satellite/aerial imaging and spectral analysis"
domain: remote_sensing
version: v1

primitives:
  - name: AtmosphericCorrection
    symbol: Ac
    scope: "Remove atmospheric absorption and scattering effects"
    decomposition: ["general/v1/Transform", "general/v1/Regularize"]

  - name: SpectralUnmixing
    symbol: Su
    scope: "Decompose mixed pixel spectra into endmember abundances"
    decomposition: ["general/v1/Invert", "general/v1/Regularize"]

  - name: PanSharpening
    symbol: Ps
    scope: "Fuse high-resolution panchromatic with multispectral data"
    decomposition: ["general/v1/Compose", "general/v1/Transform"]

  - name: GeometricCorrection
    symbol: Gc
    scope: "Orthorectification and terrain correction"
    decomposition: ["general/v1/Transform", "general/v1/Discretize"]

  - name: ChangeDetection
    symbol: Cd
    scope: "Identify temporal changes between multi-date acquisitions"
    decomposition: ["general/v1/Differentiate", "general/v1/Validate"]

  - name: SARInterferometry
    symbol: Si
    scope: "Interferometric SAR phase processing for elevation/deformation"
    decomposition: ["general/v1/Transform", "general/v1/Compose", "general/v1/Reduce"]
