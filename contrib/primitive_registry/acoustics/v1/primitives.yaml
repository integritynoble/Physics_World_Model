# PWM Acoustics Physics Primitives v1
# Dialect for acoustic wave propagation, ultrasound, sonar, and NDE.
schema_version: "1.0"
domain: acoustics
version: v1
description: >
  Physics primitives for acoustic and ultrasound forward models.
  Maps to general computational primitives via acoustics_to_general/v1.

primitives:
  - id: Propagate_A
    symbol: "P_A"
    display_name: Acoustic Propagation
    description: Free-space acoustic wave propagation (Green's function or k-space method)
    physics: wave_equation_acoustic
    maps_to_general: [Propagate, Transform]

  - id: Reflect
    symbol: "Rf"
    display_name: Reflection / Scattering
    description: Acoustic reflection at impedance boundaries (Z = ρc)
    physics: acoustic_impedance_mismatch
    maps_to_general: [Scatter, Modulate]

  - id: Transmit
    symbol: "Tr"
    display_name: Transmission
    description: Partial transmission through acoustic boundary
    physics: transmission_coefficient
    maps_to_general: [Modulate, Attenuate]

  - id: Absorb
    symbol: "Ab"
    display_name: Acoustic Absorption
    description: Frequency-dependent attenuation (α·f^n model)
    physics: viscothermal_absorption
    maps_to_general: [Attenuate]

  - id: Beamform
    symbol: "Bf"
    display_name: Beamforming
    description: Delay-and-sum or coherent compounding across transducer array
    physics: phased_array_summation
    maps_to_general: [Reduce, Compose]

  - id: Transduce
    symbol: "Td"
    display_name: Transduction
    description: Electro-acoustic conversion at transmit/receive element
    physics: piezoelectric_response
    maps_to_general: [Detect, Modulate]

  - id: Doppler
    symbol: "Dp"
    display_name: Doppler Shift
    description: Frequency shift due to moving scatterers
    physics: doppler_effect
    maps_to_general: [Transform, Differentiate]
