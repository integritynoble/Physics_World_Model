# Acoustics Primitive Registry v1
# Domain-specific primitives for acoustic wave simulation and reconstruction.
description: "Acoustics physics primitives for wave propagation, scattering, and imaging"
domain: acoustics
version: v1

primitives:
  - name: PressureWavePropagation
    symbol: Pw
    scope: "Acoustic wave propagation through homogeneous/heterogeneous media"
    decomposition: ["general/v1/Transform", "general/v1/Compose"]

  - name: AcousticScattering
    symbol: As
    scope: "Sound wave scattering from obstacles and interfaces"
    decomposition: ["general/v1/Transform", "general/v1/Stochastize"]

  - name: Beamforming
    symbol: Bf
    scope: "Delay-and-sum or adaptive beamforming for source localization"
    decomposition: ["general/v1/Reduce", "general/v1/Compose"]

  - name: AcousticAttenuation
    symbol: Aa
    scope: "Frequency-dependent absorption in tissue or material"
    decomposition: ["general/v1/Transform"]

  - name: TimeReversal
    symbol: Tr
    scope: "Time-reversal focusing for aberration correction"
    decomposition: ["general/v1/Adjoint"]

  - name: SpectralAnalysis
    symbol: Sa
    scope: "Frequency-domain decomposition of acoustic signals"
    decomposition: ["general/v1/Transform", "general/v1/Reduce"]
