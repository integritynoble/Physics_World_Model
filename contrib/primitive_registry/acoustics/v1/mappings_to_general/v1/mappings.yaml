# Acoustics -> General primitive cross-domain mappings
source_registry: "acoustics/v1"
target_registry: "general/v1"

mappings:
  - source: "PressureWavePropagation"
    target: ["general/v1/Transform", "general/v1/Compose"]
    notes: "Wave equation propagation decomposes into spatial Transform and step Compose"

  - source: "AcousticScattering"
    target: ["general/v1/Transform", "general/v1/Stochastize"]
    notes: "Scattering kernel as Transform with stochastic scatterer distribution"

  - source: "Beamforming"
    target: ["general/v1/Reduce", "general/v1/Compose"]
    notes: "Delay-and-sum is time-aligned Compose followed by channel Reduce (sum)"

  - source: "AcousticAttenuation"
    target: ["general/v1/Transform"]
    notes: "Frequency-dependent absorption modeled as a single damping Transform"

  - source: "TimeReversal"
    target: ["general/v1/Adjoint"]
    notes: "Time-reversal is the physical realization of the Adjoint operator"

  - source: "SpectralAnalysis"
    target: ["general/v1/Transform", "general/v1/Reduce"]
    notes: "FFT-based spectral decomposition is a Transform followed by band Reduce"
