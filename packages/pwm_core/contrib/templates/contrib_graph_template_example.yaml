# =============================================================================
# PWM Graph Template Contribution Example
# =============================================================================
#
# This is a complete, annotated example of how to define a new modality's
# OperatorGraph. Copy and modify this file for your modality.
#
# To add a new modality to PWM, you need entries in ALL 5 registries:
#   1. graph_templates.yaml  (this file format)
#   2. modalities.yaml       (modality metadata)
#   3. mismatch_db.yaml      (mismatch parameters)
#   4. photon_db.yaml        (noise model)
#   5. metrics_db.yaml       (which metrics to compute)
#   6. solver_registry.yaml  (which solvers work for this modality)
#
# Quickstart:
#   pwm scaffold modality my_modality    # generates all 5 files
#   # Fill in the physics, then:
#   pwm evaluate --sandbox --modality my_modality
#
# =============================================================================

# Graph ID follows convention: <modality>_graph_v<version>
# Example: simple 2D deconvolution modality

example_deconv_graph_v1:
  description: "Example: 2D convolution + noise (deconvolution problem)"

  metadata:
    modality: example_deconv
    x_shape: [64, 64]       # Input signal: 64x64 grayscale image
    y_shape: [64, 64]       # Measurement: same size (no compression)

  # Nodes: each references a primitive_id from PRIMITIVE_REGISTRY
  # Available primitives (see packages/pwm_core/pwm_core/graph/primitives.py):
  #   Propagation: fresnel_prop, angular_spectrum, ray_trace
  #   PSF/Conv:    conv2d, conv3d, deconv_rl
  #   Modulation:  coded_mask, dmd_pattern, sim_pattern
  #   Dispersion:  spectral_dispersion, imbalanced_response, chromatic_warp
  #   Sampling:    random_mask, ct_radon
  #   Noise:       poisson_gaussian, gaussian_noise, shot_noise

  nodes:
    - node_id: blur
      primitive_id: conv2d               # 2D Gaussian convolution
      params:
        sigma: 2.0                        # PSF width in pixels
        mode: reflect                     # Boundary mode
      learnable: [sigma]                  # sigma can be calibrated
      # tags: optional NodeTags
      # role: transport                   # Optional: source|transport|sensor|noise

    - node_id: noise
      primitive_id: poisson_gaussian     # Poisson-Gaussian noise model
      params:
        peak_photons: 10000.0            # Average photon count
        read_sigma: 0.01                 # Readout noise (normalized)
        seed: 0                          # RNG seed (set by harness)

  # Edges: define data flow (must form a DAG)
  edges:
    - source: blur
      target: noise

# =============================================================================
# Registry entries you also need (generated by `pwm scaffold modality`):
# =============================================================================
#
# --- modalities.yaml entry ---
# example_deconv:
#   display_name: "Example Deconvolution"
#   category: "microscopy"
#   signal_dims: 2
#   default_solver: traditional_cpu
#
# --- mismatch_db.yaml entry ---
# example_deconv:
#   parameters:
#     psf_sigma:
#       range: [0.5, 3.0]
#       typical_error: 0.3
#       unit: "pixels"
#       param_type: "blur"
#   severity_weights:
#     psf_sigma: 1.0
#   correction_method: "grid_search"
#
# --- photon_db.yaml entry ---
# example_deconv:
#   noise_model: "poisson_gaussian"
#   photon_levels:
#     standard:
#       n_photons: 10000
#       read_sigma_fraction: 0.01
#
# --- metrics_db.yaml entry ---
# (add to intensity_2d modality list)
#
# --- solver_registry.yaml entry ---
# example_deconv:
#   traditional_cpu:
#     name: Richardson-Lucy
#     module: pwm_core.recon.richardson_lucy
#     function: richardson_lucy_2d
