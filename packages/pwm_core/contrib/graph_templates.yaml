version: '1.0'
templates:
  widefield_graph_v1:
    description: 'Widefield fluorescence microscopy: PSF convolution + noise'
    metadata:
      modality: widefield
      x_shape:
      - 64
      - 64
      y_shape:
      - 64
      - 64
    nodes:
    - node_id: blur
      primitive_id: conv2d
      params:
        sigma: 2.0
        mode: reflect
      learnable:
      - sigma
    - node_id: noise
      primitive_id: poisson_gaussian
      params:
        peak_photons: 10000.0
        read_sigma: 0.01
        seed: 0
    edges:
    - source: blur
      target: noise
  widefield_lowdose_graph_v1:
    description: 'Low-dose widefield microscopy: heavy PSF blur + high noise'
    metadata:
      modality: widefield_lowdose
      x_shape:
      - 64
      - 64
      y_shape:
      - 64
      - 64
    nodes:
    - node_id: blur
      primitive_id: conv2d
      params:
        sigma: 3.0
        mode: reflect
      learnable:
      - sigma
    - node_id: noise
      primitive_id: poisson_gaussian
      params:
        peak_photons: 1000.0
        read_sigma: 0.05
        seed: 0
    edges:
    - source: blur
      target: noise
  confocal_livecell_graph_v1:
    description: 'Live-cell confocal microscopy: tight PSF + low photon budget'
    metadata:
      modality: confocal_livecell
      x_shape:
      - 64
      - 64
      y_shape:
      - 64
      - 64
    nodes:
    - node_id: blur
      primitive_id: conv2d
      params:
        sigma: 1.2
        mode: reflect
      learnable:
      - sigma
    - node_id: noise
      primitive_id: poisson_gaussian
      params:
        peak_photons: 5000.0
        read_sigma: 0.02
        seed: 0
    edges:
    - source: blur
      target: noise
  confocal_3d_graph_v1:
    description: '3D confocal microscopy: volumetric PSF convolution'
    metadata:
      modality: confocal_3d
      x_shape:
      - 32
      - 64
      - 64
      y_shape:
      - 32
      - 64
      - 64
    nodes:
    - node_id: blur_3d
      primitive_id: conv3d
      params:
        sigma:
        - 3.0
        - 1.5
        - 1.5
        mode: reflect
      learnable:
      - sigma
    - node_id: noise
      primitive_id: poisson_gaussian
      params:
        peak_photons: 8000.0
        read_sigma: 0.02
        seed: 0
    edges:
    - source: blur_3d
      target: noise
  sim_graph_v1:
    description: 'Structured illumination microscopy: pattern modulation + PSF + integration'
    metadata:
      modality: sim
      x_shape:
      - 64
      - 64
      y_shape:
      - 64
      - 64
    nodes:
    - node_id: pattern
      primitive_id: sim_pattern
      params:
        H: 64
        W: 64
        freq: 0.1
        angle: 0.0
        phase: 0.0
      learnable:
      - freq
      - angle
      - phase
    - node_id: blur
      primitive_id: conv2d
      params:
        sigma: 1.5
        mode: reflect
    - node_id: noise
      primitive_id: poisson_gaussian
      params:
        peak_photons: 10000.0
        read_sigma: 0.01
        seed: 0
    edges:
    - source: pattern
      target: blur
    - source: blur
      target: noise
  lightsheet_graph_v1:
    description: 'Light-sheet microscopy: axial sectioning + lateral PSF'
    metadata:
      modality: lightsheet
      x_shape:
      - 64
      - 64
      y_shape:
      - 64
      - 64
    nodes:
    - node_id: blur
      primitive_id: conv2d
      params:
        sigma: 1.0
        mode: reflect
      learnable:
      - sigma
    - node_id: noise
      primitive_id: poisson_gaussian
      params:
        peak_photons: 15000.0
        read_sigma: 0.01
        seed: 0
    edges:
    - source: blur
      target: noise
  cassi_graph_v1:
    description: 'Single-disperser CASSI: coded mask + spectral dispersion + integration + noise'
    metadata:
      modality: cassi
      x_shape:
      - 64
      - 64
      - 8
      y_shape:
      - 64
      - 64
    nodes:
    - node_id: modulate
      primitive_id: coded_mask
      params:
        seed: 42
        H: 64
        W: 64
      learnable: []
    - node_id: disperse
      primitive_id: spectral_dispersion
      params:
        disp_step: 1.0
      learnable:
      - disp_step
    - node_id: integrate
      primitive_id: frame_integration
      params:
        axis: -1
        T: 8
    - node_id: noise
      primitive_id: poisson_gaussian
      params:
        peak_photons: 10000.0
        read_sigma: 0.01
        seed: 0
    edges:
    - source: modulate
      target: disperse
    - source: disperse
      target: integrate
    - source: integrate
      target: noise
  spc_graph_v1:
    description: 'Single-pixel camera: random measurement matrix'
    metadata:
      modality: spc
      x_shape:
      - 64
      - 64
      y_shape:
      - 614
    nodes:
    - node_id: measure
      primitive_id: random_mask
      params:
        seed: 42
        H: 64
        W: 64
        sampling_rate: 0.15
    - node_id: noise
      primitive_id: gaussian
      params:
        sigma: 0.01
        seed: 0
    edges:
    - source: measure
      target: noise
  cacti_graph_v1:
    description: 'CACTI snapshot compressive imaging: temporal coded mask + integration'
    metadata:
      modality: cacti
      x_shape:
      - 64
      - 64
      - 8
      y_shape:
      - 64
      - 64
    nodes:
    - node_id: mask
      primitive_id: temporal_mask
      params:
        H: 64
        W: 64
        T: 8
        seed: 42
    - node_id: noise
      primitive_id: poisson_gaussian
      params:
        peak_photons: 10000.0
        read_sigma: 0.01
        seed: 0
    edges:
    - source: mask
      target: noise
  matrix_graph_v1:
    description: 'Generic matrix operator (A @ x): random measurement'
    metadata:
      modality: matrix
      x_shape:
      - 64
      - 64
      y_shape:
      - 1024
    nodes:
    - node_id: project
