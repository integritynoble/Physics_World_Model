modality_id: maldi_msi
display_name: MALDI Mass Spectrometry Imaging
category: Scientific Instrumentation
canonical_dag: S --> D
carrier: Ion
maturity: M0
forward_model_type: nonlinear_operator
default_solver: peak_picking
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: maldi_msi
has_dedicated_operator: true
graph_template_id: maldi_msi_graph_v1
theta: {}
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: desi_msi_brain
  dataset_url: https://metaspace2020.eu/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: 'Alexandrov, T. et al. (2019) METASPACE 2020: community knowledge base,
    Nature Methods'
  license: CC-BY-4.0
mismatch_params:
- name: Laser fluence drift
  nominal: 1.0
  range:
  - 0.8
  - 1.2
  unit: '-'
- name: Mass accuracy
  nominal: 0.0
  range:
  - -5.0
  - 5.0
  unit: ppm
- name: Extraction delay
  nominal: 100.0
  range:
  - 80.0
  - 120.0
  unit: ns
- name: Matrix crystallization
  nominal: 1.0
  range:
  - 0.7
  - 1.3
  unit: '-'
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: &id001
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  msi_dl:
    name: MSI-UNet [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: *id001
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / maldi_msi_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
