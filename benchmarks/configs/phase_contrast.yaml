modality_id: phase_contrast
display_name: Phase Contrast Microscopy
category: Microscopy
canonical_dag: C --> D
carrier: Photon
maturity: M0
forward_model_type: linear_operator
default_solver: halo_removal
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: phase_contrast
has_dedicated_operator: true
graph_template_id: phase_contrast_graph_v1
theta:
  sigma: 2.0
  read_noise_e: 5.0
  pixel_size_um: 6.5
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: phase_contrast_cells
  dataset_url: https://bbbc.broadinstitute.org/BBBC004
  fallback: generated
  synthetic_generator: cell_phantom
  citation: Ljosa, V. et al. (2012) BBBC annotated high-throughput microscopy image
    sets, Nature Methods
  license: CC0
mismatch_params:
- name: Phase ring alignment
  nominal: 0.0
  range:
  - 0.0
  - 5.0
  unit: um offset
- name: Halo artifact strength
  nominal: 0.0
  range:
  - 0.0
  - 0.3
  unit: relative
- name: Phase ring absorption
  nominal: 0.7
  range:
  - 0.5
  - 0.9
  unit: '-'
solvers:
  traditional_cpu:
    name: Richardson-Lucy
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: CARE
    module: pwm_core.recon.care_unet
    function: run_care
    params: 2M
    gpu: true
    reference: Weigert et al. 2018
  pc_dl:
    name: PhaseNet
    module: pwm_core.recon.phase_contrast_solvers
    function: phase_net_recon
    params: 10M
    gpu: true
    reference: 'Rivenson, Y. et al. (2018) Phase recovery with DL, Light: Sci. & Appl.
      7:17141'
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / phase_contrast_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
