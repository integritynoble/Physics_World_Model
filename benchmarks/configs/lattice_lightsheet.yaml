modality_id: lattice_lightsheet
display_name: Lattice Light-Sheet Microscopy
category: Microscopy
canonical_dag: C --> D
carrier: Photon
maturity: M0
forward_model_type: linear_operator
default_solver: richardson_lucy_3d
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: lattice_lightsheet
has_dedicated_operator: true
graph_template_id: lattice_lightsheet_graph_v1
theta:
  sigma: 2.0
  read_noise_e: 5.0
  pixel_size_um: 6.5
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: llsm_cell_dataset
  dataset_url: https://downloads.openmicroscopy.org/images/
  fallback: generated
  synthetic_generator: cell_phantom
  citation: Chen, B.C. et al. (2014) Lattice light-sheet microscopy, Science 346:1257998
  license: CC-BY-4.0 (OpenMicroscopy)
mismatch_params:
- name: Lattice period error
  nominal: 0.0
  range:
  - -5.0
  - 5.0
  unit: relative
- name: Dithering range
  nominal: 0.0
  range:
  - 0
  - 0
  unit: '-'
- name: Sheet NA error
  nominal: 0.0
  range:
  - -0.05
  - 0.05
  unit: '-'
- name: Excitation PSF sidelobe
  nominal: 0.0
  range:
  - 0.0
  - 10.0
  unit: relative
solvers:
  traditional_cpu:
    name: Richardson-Lucy
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: CARE
    module: pwm_core.recon.care_unet
    function: run_care
    params: 2M
    gpu: true
    reference: Weigert et al. 2018
  llsm_dl:
    name: LLSM-CARE
    module: pwm_core.recon.llsm_solvers
    function: llsm_care_recon
    params: 15M
    gpu: true
    reference: Weigert, M. et al. (2018) Content-aware restoration for lattice light-sheet,
      Nature Methods 15:1090
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / lattice_lightsheet_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
