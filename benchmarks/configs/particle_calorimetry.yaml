data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: calorimetergan_dataset
  dataset_url: https://zenodo.org/record/6366271
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Kruse, M. et al. (2022) CaloChallenge 2022 Dataset, Zenodo
