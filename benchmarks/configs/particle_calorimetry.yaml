modality_id: particle_calorimetry
display_name: Particle Calorimetry
category: Broader Experimental Science
canonical_dag: R --> Sigma --> D
carrier: Particle
maturity: M0
forward_model_type: nonlinear_operator
default_solver: energy_recon
tier: A
x_shape:
- 64
- 64
