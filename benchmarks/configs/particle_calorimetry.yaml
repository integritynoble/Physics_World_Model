- name: Energy scale factor
  nominal: 1.0
  range:
  - 0.97
  - 1.03
  unit: '-'
- name: Position resolution
  nominal: 0.0
  range:
  - 0.0
  - 5.0
  unit: mm
- name: Sampling fraction
  nominal: 0.1
  range:
  - 0.08
  - 0.12
  unit: '-'
- name: Pile-up fraction
  nominal: 0.0
  range:
  - 0.0
  - 0.05
  unit: '-'
solvers:
  traditional_cpu:
    name: Adjoint
    module: pwm_core.recon.adjoint
    function: run_adjoint
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: PnP-ADMM
    module: pwm_core.recon.pnp_admm
    function: pnp_admm_recon
    params: 2M
    gpu: true
    reference: ''
  cal_dl:
    name: CaloDiffusion
    module: pwm_core.recon.calorimetry_solvers
    function: calo_diffusion_recon
    params: 25M
    gpu: true
    reference: Acosta, M. et al. (2023) CaloDiffusion for jet simulation, Phys. Rev.
      D 108(1)
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
