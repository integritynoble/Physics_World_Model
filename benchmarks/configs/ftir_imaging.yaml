modality_id: ftir_imaging
display_name: FTIR Spectroscopic Imaging
category: Spectroscopy & Spectral Imaging
canonical_dag: M --> Sigma --> D
carrier: IR
maturity: M0
forward_model_type: linear_operator
default_solver: interferogram_fft
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: ftir_imaging
has_dedicated_operator: true
graph_template_id: ftir_imaging_graph_v1
theta:
  density: 0.5
assets: {}
category_module: compressive_mask
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: ftir_cancer_tissue
  dataset_url: https://zenodo.org/record/5559857
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Bassan, P. et al. (2012) FTIR microscopy of biological cells, Analyst,
    RSC
  license: CC-BY-4.0
mismatch_params:
- name: Wavenumber calibration
  nominal: 0.0
  range:
  - -2.0
  - 2.0
  unit: cm^-1
- name: Water vapor absorption
  nominal: 0.0
  range:
  - 0
  - 0
  unit: '-'
- name: Detector nonlinearity
  nominal: 0.0
  range:
  - 0.0
  - 5.0
  unit: '-'
- name: ATR crystal RI error
  nominal: 0.0
  range:
  - -1.0
  - 1.0
  unit: '-'
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: &id001
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  ftir_dl:
    name: FTIR-UNet [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: *id001
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / ftir_imaging_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
