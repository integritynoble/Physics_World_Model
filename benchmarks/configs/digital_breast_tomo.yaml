modality_id: digital_breast_tomo
display_name: Digital Breast Tomosynthesis (DBT)
category: Medical Imaging
canonical_dag: Pi --> D
carrier: X-ray
maturity: M0
forward_model_type: linear_operator
default_solver: back_projection
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: digital_breast_tomo
has_dedicated_operator: true
graph_template_id: digital_breast_tomo_graph_v1
theta:
  n_angles: 180
  pixel_size_um: 50.0
assets: {}
category_module: medical_ct_radon
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: mammography_ddsm
  dataset_url: https://wiki.cancerimagingarchive.net/display/Public/CBIS-DDSM
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Lee et al., Scientific Data 2017
  license: CC-BY-3.0
mismatch_params:
- name: Angular range error
  nominal: 0.0
  range:
  - -2.0
  - 2.0
  unit: deg total
- name: Detector motion blur
  nominal: 0.0
  range:
  - 0.0
  - 0.5
  unit: px
- name: Scatter fraction
  nominal: 0.3
  range:
  - 0.1
  - 0.6
  unit: '-'
solvers:
  traditional_cpu:
    name: FBP
    module: pwm_core.recon.fbp
    function: run_fbp
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: DL-Recon
    module: pwm_core.recon.dl_recon
    function: dl_reconstruct
    params: 5M
    gpu: true
    reference: ''
  dbt_dl:
    name: DBT-DL
    module: pwm_core.recon.dbt_solvers
    function: dbt_unet_recon
    params: 31M
    gpu: true
    reference: Wu, N. et al. (2021) DL for DBT reconstruction, MICCAI 2021
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: Lee et al., Scientific Data 2017
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / digital_breast_tomo_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
