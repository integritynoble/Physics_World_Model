modality_id: active_thermography
display_name: Active Thermography (IR)
category: Industrial Inspection
canonical_dag: P --> D
carrier: IR
maturity: M0
forward_model_type: nonlinear_operator
default_solver: thermal_diffusivity_inversion
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: active_thermography
has_dedicated_operator: true
graph_template_id: active_thermography_graph_v1
theta: {}
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: thermal_bridge_dataset
  dataset_url: https://www.ndt.net/article/ewgae2016/papers/tu3b2.pdf
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Maierhofer, C. et al. (2014) Thermographic defect characterisation, NDT&E
    Int.
  license: Research use
mismatch_params:
- name: Emissivity error
  nominal: 0.95
  range:
  - 0.85
  - 1.0
  unit: '-'
- name: Heat source power drift
  nominal: 1.0
  range:
  - 0.9
  - 1.1
  unit: '-'
- name: Background temperature
  nominal: 25.0
  range:
  - 20.0
  - 30.0
  unit: C
- name: Integration time offset
  nominal: 0.0
  range:
  - -0.1
  - 0.1
  unit: s
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  pulsed_phase_tv:
    name: Pulsed-Phase TV [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 75
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / active_thermography_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
