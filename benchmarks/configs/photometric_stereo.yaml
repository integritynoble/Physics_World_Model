modality_id: photometric_stereo
display_name: Photometric Stereo
category: Depth Imaging
canonical_dag: M --> C --> D
carrier: Photon
maturity: M0
forward_model_type: nonlinear_operator
default_solver: normal_estimation
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: photometric_stereo
has_dedicated_operator: true
graph_template_id: photometric_stereo_graph_v1
theta:
  sigma: 2.0
  read_noise_e: 5.0
  pixel_size_um: 6.5
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: diligent_benchmark
  dataset_url: https://sites.google.com/site/photometricstereodata/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Shi, B. et al. (2016) Benchmark Dataset and Evaluation for Photometric
    Stereo, TPAMI 38(2)
  license: Research use
mismatch_params:
- name: Light direction error
  nominal: 0.0
  range:
  - 0.0
  - 5.0
  unit: deg per source
- name: Light intensity calibration
  nominal: 1.0
  range:
  - 0.8
  - 1.2
  unit: '-'
- name: Non-Lambertian surface fraction
  nominal: 0.0
  range:
  - 0.0
  - 30.0
  unit: '-'
- name: Cast shadow fraction
  nominal: 0.0
  range:
  - 0.0
  - 15.0
  unit: of pixels
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: &id001
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  ps_dl:
    name: PS-FCN [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: *id001
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / photometric_stereo_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
