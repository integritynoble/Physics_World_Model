modality_id: xrf_tomo
display_name: X-ray Fluorescence Tomography
category: Scientific Instrumentation
canonical_dag: Pi --> R --> D
carrier: X-ray
maturity: M0
forward_model_type: nonlinear_operator
default_solver: fbp_self_absorption
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: xrf_tomo
has_dedicated_operator: true
graph_template_id: xrf_tomo_graph_v1
theta:
  n_angles: 180
  pixel_size_um: 50.0
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: xrf_dataset
  dataset_url: https://www.aps.anl.gov/Science/Scientific-Software/XRF-Maps
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Vogt et al., APS XRF Maps
  license: Public domain
mismatch_params:
- name: Self-absorption correction
  nominal: 0.0
  range:
  - 0.0
  - 30.0
  unit: '-'
- name: Rotation axis offset
  nominal: 0.0
  range:
  - -3.0
  - 3.0
  unit: px
- name: Fluorescence yield error
  nominal: 0.0
  range:
  - -10.0
  - 10.0
  unit: '-'
- name: Dead time at high count rate
  nominal: 0.0
  range:
  - 0.0
  - 10.0
  unit: '-'
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  xrft_dl:
    name: XRFT-Net [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 75
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: Vogt et al., APS XRF Maps
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / xrf_tomo_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
