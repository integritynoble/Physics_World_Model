modality_id: xray_ndt
display_name: X-ray NDT (Radiography)
category: Industrial Inspection
canonical_dag: Pi --> D
carrier: X-ray
maturity: M0
forward_model_type: nonlinear_operator
default_solver: contrast_enhancement
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: xray_ndt
has_dedicated_operator: true
graph_template_id: xray_ndt_graph_v1
theta:
  n_angles: 180
  pixel_size_um: 50.0
assets: {}
category_module: medical_ct_radon
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: gdxray_castings
  dataset_url: https://domingomery.ing.puc.cl/material/gdxray/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: 'Mery, D. et al. (2015) GDXray: X-ray image database for NDT, J. Nondestruct.
    Eval. 34:42'
  license: CC-BY-4.0
mismatch_params:
- name: Source position error
  nominal: 0.0
  range:
  - -1.0
  - 1.0
  unit: mm
- name: Beam hardening
  nominal: 0.0
  range:
  - 0.0
  - 0.1
  unit: '-'
- name: Detector gain drift
  nominal: 1.0
  range:
  - 0.95
  - 1.05
  unit: '-'
- name: Geometric magnification
  nominal: 2.0
  range:
  - 1.8
  - 2.2
  unit: '-'
solvers:
  traditional_cpu:
    name: Adjoint
    module: pwm_core.recon.adjoint
    function: run_adjoint
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: PnP-ADMM
    module: pwm_core.recon.pnp_admm
    function: pnp_admm_recon
    params: 2M
    gpu: true
    reference: ''
  ndt_dl:
    name: NDT-DefectNet
    module: pwm_core.recon.xray_ndt_solvers
    function: ndt_defect_net
    params: 20M
    gpu: true
    reference: Du, W. et al. (2021) DL for NDT defect detection, NDT&E Int. 120
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / xray_ndt_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
