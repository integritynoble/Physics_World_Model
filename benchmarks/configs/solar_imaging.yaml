modality_id: solar_imaging
display_name: Solar EUV/X-ray Imaging
category: Astronomy & Space Imaging
canonical_dag: M --> P --> D
carrier: Photon/EUV
maturity: M0
forward_model_type: nonlinear_operator
default_solver: dem_inversion
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: solar_imaging
has_dedicated_operator: true
graph_template_id: solar_imaging_graph_v1
theta:
  density: 0.5
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: sdo_aia_dataset
  dataset_url: https://sdo.gsfc.nasa.gov/data/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Lemen, J.R. et al. (2012) The AIA on the Solar Dynamics Observatory, Sol.
    Phys. 275:17
  license: Public domain (NASA/SDO)
mismatch_params:
- name: PSF degradation (mirror aging)
  nominal: 0.0
  range:
  - 0.0
  - 20.0
  unit: '-'
- name: Stray light
  nominal: 0.0
  range:
  - 0.0
  - 5.0
  unit: '-'
- name: Flat-field error
  nominal: 0.0
  range:
  - 0.0
  - 3.0
  unit: '-'
- name: Pointing jitter
  nominal: 0.0
  range:
  - 0.0
  - 1.0
  unit: arcsec
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  solar_dl:
    name: SolarNet [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 75
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / solar_imaging_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
