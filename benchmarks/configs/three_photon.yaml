modality_id: three_photon
display_name: Three-Photon Microscopy
category: Microscopy
canonical_dag: C --> D
carrier: Photon
maturity: M0
forward_model_type: nonlinear_operator
default_solver: richardson_lucy
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: three_photon
has_dedicated_operator: true
graph_template_id: three_photon_graph_v1
theta:
  sigma: 2.0
  read_noise_e: 5.0
  pixel_size_um: 6.5
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: 3p_brain_dataset
  dataset_url: https://doi.org/10.1038/s41592-021-01239-8
  fallback: generated
  synthetic_generator: cell_phantom
  citation: Ouzounov, D.G. et al. (2017) In vivo three-photon imaging of activity
    of GCaMP6-labeled neurons, Nature Methods 14:388
  license: Research use
mismatch_params:
- name: Scattering coeff
  nominal: 15.0
  range:
  - 8.0
  - 40.0
  unit: mm^-1
- name: Excitation wavelength shift
  nominal: 0.0
  range:
  - -10.0
  - 10.0
  unit: nm
- name: Depth-dependent PSF
  nominal: 0.0
  range:
  - 0.5
  - 2.0
  unit: '-'
solvers:
  traditional_cpu:
    name: Richardson-Lucy
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: CARE
    module: pwm_core.recon.care_unet
    function: care_restore_2d
    params: 2M
    gpu: true
    reference: Weigert et al. 2018
  3p_dl:
    name: 3P-Net (CARE)
    module: pwm_core.recon.three_photon_solvers
    function: three_photon_care_recon
    params: 15M
    gpu: true
    reference: Weigert, M. et al. (2018) CARE for 3P deep tissue imaging, Nature Methods
      15:1090
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / three_photon_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
