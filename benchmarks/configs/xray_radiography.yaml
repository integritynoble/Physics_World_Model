modality_id: xray_radiography
display_name: X-ray Radiography
category: Medical Imaging
canonical_dag: Pi --> D
carrier: X-ray
maturity: M0
forward_model_type: nonlinear_operator
default_solver: tv_fista
tier: A
x_shape:
- 512
- 512
y_shape:
- 512
- 512
operator_id: xray_radiography
has_dedicated_operator: true
graph_template_id: xray_radiography_graph_v2
theta:
  tube_voltage_kvp: 80
  tube_current_ma: 100
  focal_spot_mm: 0.6
  mean_attenuation_coefficient: 0.2
  pixel_size_um: 150
  scintillator: CsI
  bit_depth: 14
assets: {}
category_module: medical_ct_radon
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: chestxray14
  dataset_url: https://nihcc.app.box.com/v/ChestXray-NIHCC
  fallback: generated
  synthetic_generator: shepp_logan
  citation: 'Wang et al., ChestX-ray8: Hospital-scale Chest X-ray Database and Benchmarks,
    CVPR 2017'
  license: CC0 1.0
mismatch_params:
- name: Scatter fraction
  nominal: 0.0
  range:
  - 0.0
  - 0.4
  unit: '-'
- name: Beam hardening
  nominal: 0.0
  range:
  - -4.0
  - 2.0
  unit: '-'
- name: Detector lag
  nominal: 0.0
  range:
  - 0.0
  - 0.1
  unit: fraction
solvers:
  traditional_cpu:
    name: FBP (X-ray radiography)
    module: pwm_core.recon.ct_solvers
    function: run_fbp
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: CheXNet [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: &id001
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  famous_dl:
    name: X-ray UNet [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: *id001
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: 'Wang et al., ChestX-ray8: Hospital-scale Chest X-ray Database and
      Benchmarks, CVPR 2017'
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / xray_radiography_graph_v2
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
