modality_id: coronagraphy
display_name: Stellar Coronagraphy
category: Astronomy & Space Imaging
canonical_dag: M --> P --> D
carrier: Photon
maturity: M0
forward_model_type: nonlinear_operator
default_solver: adi_speckle_subtraction
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: coronagraphy
has_dedicated_operator: true
graph_template_id: coronagraphy_graph_v1
theta:
  density: 0.5
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: sphere_coronagraph_dataset
  dataset_url: http://sphere.osug.fr/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: 'Beuzit, J.L. et al. (2019) SPHERE: The Exoplanet Imager, A&A 631:A155'
  license: ESO Public data (CC-BY)
mismatch_params:
- name: Coronagraph mask centering
  nominal: 0.0
  range:
  - 0.0
  - 0.1
  unit: lambda/D
- name: Wavefront error (WFE)
  nominal: 0.0
  range:
  - 0.0
  - 100.0
  unit: '-'
- name: Stellar leakage
  nominal: 1.0e-06
  range:
  - -7.0
  - 1.0
  unit: contrast
- name: Speckle lifetime
  nominal: 0.0
  range:
  - 0.1
  - 100.0
  unit: s
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  speckle_null_dl:
    name: DL-SpeckleNull [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 75
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / coronagraphy_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
