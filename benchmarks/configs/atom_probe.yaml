modality_id: atom_probe
display_name: Atom Probe Tomography (APT)
category: Scientific Instrumentation
canonical_dag: S --> D
carrier: Ion
maturity: M0
forward_model_type: nonlinear_operator
default_solver: trajectory_recon
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: atom_probe
has_dedicated_operator: true
graph_template_id: atom_probe_graph_v1
theta: {}
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: apt_steel_dataset
  dataset_url: https://www.apmworkbench.com/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Miller, M.K. & Forbes, R. (2014) Atom-Probe Tomography, Springer
  license: Research use
mismatch_params:
- name: Flight path error
  nominal: 0.0
  range:
  - -0.5
  - 0.5
  unit: mm
- name: Voltage calibration
  nominal: 1.0
  range:
  - 0.98
  - 1.02
  unit: '-'
- name: Detection efficiency
  nominal: 0.6
  range:
  - 0.5
  - 0.7
  unit: '-'
- name: Tip radius error
  nominal: 0.0
  range:
  - -5.0
  - 5.0
  unit: nm
solvers:
  traditional_cpu:
    name: Adjoint
    module: pwm_core.recon.adjoint
    function: run_adjoint
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: PnP-ADMM
    module: pwm_core.recon.pnp_admm
    function: pnp_admm_recon
    params: 2M
    gpu: true
    reference: ''
  apt_dl:
    name: APT-Net
    module: pwm_core.recon.apt_solvers
    function: apt_net_recon
    params: 6M
    gpu: true
    reference: Haley, D. et al. (2020) Prospects for atom-by-atom analysis, npj Comput.
      Mater. 6:149
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / atom_probe_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
