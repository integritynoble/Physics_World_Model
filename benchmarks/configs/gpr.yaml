modality_id: gpr
display_name: Ground-Penetrating Radar (GPR)
category: Remote Sensing
canonical_dag: P --> D
carrier: RF
maturity: M0
forward_model_type: nonlinear_operator
default_solver: migration
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: gpr
has_dedicated_operator: true
graph_template_id: gpr_graph_v1
theta: {}
assets: {}
category_module: remote_sensing_sar
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: gpr_subsurface_dataset
  dataset_url: https://doi.org/10.1109/LGRS.2019.2896368
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Giannakis, I. et al. (2019) Realistic FDTD GPR antenna models, IEEE GRSL
  license: Research use
mismatch_params:
- name: Soil permittivity error
  nominal: 9.0
  range:
  - 6.0
  - 15.0
  unit: '-'
- name: Antenna height
  nominal: 0.0
  range:
  - -0.05
  - 0.05
  unit: m
- name: Time zero offset
  nominal: 0.0
  range:
  - -0.5
  - 0.5
  unit: ns
- name: Velocity model error
  nominal: 0.1
  range:
  - 0.08
  - 0.13
  unit: m/ns
solvers:
  traditional_cpu:
    name: RDA
    module: pwm_core.recon.sar_rda
    function: range_doppler
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: SAR-DL
    module: pwm_core.recon.sar_dl
    function: sar_dl_recon
    params: 5M
    gpu: true
    reference: ''
  gpr_dl:
    name: GPR-Net
    module: pwm_core.recon.gpr_solvers
    function: gpr_net_recon
    params: 9M
    gpu: true
    reference: Giannakis, I. et al. (2021) DL-enhanced GPR data processing, IEEE Geosci.
      Remote Sens. Lett. 19
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / gpr_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
