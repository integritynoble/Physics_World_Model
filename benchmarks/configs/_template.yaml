# Benchmark Config Template
# This file shows the expected structure for modality YAML configs.
# Actual configs are auto-generated by benchmarks/runners/generate_configs.py

modality_id: "example_modality"
display_name: "Example Modality"
category: "Microscopy"
canonical_dag: "C --> D"
carrier: "Photon"
maturity: "M0"
forward_model_type: "linear_operator"
default_solver: "wiener"

# Tier classification: A (has operator + YAML), B (YAML, no operator), C (spec only)
tier: "C"

# Signal dimensions
x_shape: [64, 64]
y_shape: [64, 64]

# Operator
operator_id: "example_modality"
has_dedicated_operator: false
graph_template_id: ""
theta: {}
assets: {}

# Category module (shared physics)
category_module: "microscopy_psf"

# Data source priority
data_source:
  priority: ["web", "experimental", "synthetic_web", "generated"]
  dataset_id: ""
  dataset_url: ""
  fallback: "generated"
  synthetic_generator: "cell_phantom"
  citation: ""
  license: ""

# Mismatch parameters
mismatch_params:
  - name: "PSF sigma"
    nominal: 2.0
    range: [1.2, 3.5]
    unit: "px"
  - name: "Background level"
    nominal: 50
    range: [0, 200]
    unit: "counts"

# Solver configurations
solvers:
  traditional_cpu:
    name: "Wiener"
    module: ""
    function: ""
    params: "0"
    gpu: false
  best_quality:
    name: "DL Solver"
    module: ""
    function: ""
    params: "2M"
    gpu: true

# Metrics
metrics:
  names: ["psnr", "ssim"]
  primary: "psnr"
  thresholds:
    psnr: 25.0

# Performance references
reference_psnr: null
expected_psnr_range: [25, 40]

# Source attribution
source_attribution:
  ground_truth:
    type: "generated"
    reference: "Synthetic phantom"
  forward_model:
    type: "registry"
    reference: "pwm graph_templates.yaml"
  solver:
    type: "registry"
    reference: "pwm solver_registry.yaml"
  mismatch_ranges:
    type: "registry"
    reference: "pwm modality_benchmarks spec"
