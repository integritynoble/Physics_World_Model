modality_id: saxs
display_name: Small-Angle X-ray Scattering (SAXS)
category: Scientific Instrumentation
canonical_dag: R --> D
carrier: X-ray
maturity: M0
forward_model_type: nonlinear_operator
default_solver: desmearing
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: saxs
has_dedicated_operator: true
graph_template_id: saxs_graph_v1
theta:
  sigma: 2.0
  read_noise_e: 5.0
  pixel_size_um: 6.5
assets: {}
category_module: remote_sensing_sar
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: sasbdb_proteins
  dataset_url: https://www.sasbdb.org/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: 'Valentini, E. et al. (2015) SASBDB: A repository for biological SAXS
    data, Nucleic Acids Res.'
  license: CC-BY-4.0
mismatch_params:
- name: Sample-detector distance
  nominal: 1000.0
  range:
  - 990.0
  - 1010.0
  unit: mm
- name: Beam center x
  nominal: 0.0
  range:
  - -2.0
  - 2.0
  unit: px
- name: Beam center y
  nominal: 0.0
  range:
  - -2.0
  - 2.0
  unit: px
- name: Wavelength error
  nominal: 0.0
  range:
  - -0.001
  - 0.001
  unit: nm
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  saxs_dl:
    name: SAXS-VAE [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 75
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / saxs_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
