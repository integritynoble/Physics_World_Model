modality_id: expansion
display_name: Expansion Microscopy (ExM)
category: Microscopy
canonical_dag: C --> D
carrier: Photon
maturity: M0
forward_model_type: linear_operator
default_solver: richardson_lucy
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: expansion
has_dedicated_operator: true
graph_template_id: expansion_graph_v1
theta:
  sigma: 2.0
  read_noise_e: 5.0
  pixel_size_um: 6.5
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: exm_neuron_dataset
  dataset_url: https://www.biorxiv.org/content/10.1101/289132
  fallback: generated
  synthetic_generator: cell_phantom
  citation: Chen, F. et al. (2015) Expansion microscopy, Science 347:543
  license: Research use
mismatch_params:
- name: Expansion factor
  nominal: 4.0
  range:
  - 3.5
  - 4.5
  unit: x
- name: Local distortion
  nominal: 0.0
  range:
  - 0.0
  - 5.0
  unit: relative
- name: Anisotropic expansion
  nominal: 0.0
  range:
  - 0.0
  - 3.0
  unit: x vs y
solvers:
  traditional_cpu:
    name: Richardson-Lucy
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: CARE
    module: pwm_core.recon.care_unet
    function: run_care
    params: 2M
    gpu: true
    reference: Weigert et al. 2018
  exm_dl:
    name: EXpansionNet
    module: pwm_core.recon.expansion_solvers
    function: expansion_dl_recon
    params: 12M
    gpu: true
    reference: Weigert, M. et al. (2018) CARE for fluorescence microscopy, Nature
      Methods 15:1090
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / expansion_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
