modality_id: cassi
display_name: Coded Aperture Snapshot Spectral Imaging (CASSI)
category: Compressive Imaging
canonical_dag: M --> W --> Sigma --> D
carrier: Photon
maturity: M3
forward_model_type: linear_operator
default_solver: mst
tier: A
x_shape:
- 256
- 256
- 28
y_shape:
- 256
- 310
operator_id: cassi
has_dedicated_operator: true
graph_template_id: cassi_graph_v1
theta:
  type: halogen
  spectral_range_nm:
  - 450
  - 650
  n_bands: 28
  band_spacing_nm: 7.14
  mask_type: binary_random
  density: 0.5
  feature_size_um: 50
  substrate_material: glass
  focal_length_mm: 75
  f_number: 4.0
  dispersion_step_px: 2
  dispersion_direction_deg: 0.0
  prism_material: SF11
  total_shift_px: 54
  pixel_size_um: 12.0
  read_noise_e: 5.0
  quantum_efficiency: 0.75
  full_well_e: 20000
  bit_depth: 12
assets: {}
category_module: compressive_mask
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: kaist_mst_10scenes
  dataset_url: https://github.com/caiyuanhao1998/MST/tree/main/simulation/test_datasets
  fallback: generated
  synthetic_generator: spectral_scene
  citation: Cai et al., Mask-guided Spectral-wise Transformer for Efficient Hyperspectral
    Image Reconstruction, CVPR 2022
  license: MIT
mismatch_params:
- name: Mask shift dx
  nominal: 0.0
  range:
  - -3.0
  - 3.0
  unit: px
- name: Mask shift dy
  nominal: 0.0
  range:
  - -3.0
  - 3.0
  unit: px
- name: Mask rotation
  nominal: 0.0
  range:
  - -2.0
  - 2.0
  unit: deg
- name: Dispersion slope a1
  nominal: 2.0
  range:
  - 1.5
  - 2.5
  unit: px/band
- name: Dispersion offset alpha
  nominal: 0.0
  range:
  - -0.5
  - 0.5
  unit: px
- name: Gain
  nominal: 1.0
  range:
  - 0.9
  - 1.1
  unit: '-'
- name: Read noise
  nominal: 5.0
  range:
  - 1.0
  - 15.0
  unit: e-
solvers:
  traditional_cpu:
    name: GAP-TV
    module: pwm_core.recon.gap_tv
    function: run_gap_tv
    params:
      n_bands: 28
      iterations: 50
      lam: 0.05
      step: 2
    gpu: false
    reference: Yuan et al. 2016
  best_quality:
    name: GAP-TV (guided)
    module: pwm_core.recon.gap_tv
    function: run_gap_tv
    params:
      n_bands: 28
      iterations: 100
      lam: 0.03
      step: 2
    gpu: false
    reference: Yuan et al. 2016
  famous_dl:
    name: GAP-TV (fast)
    module: pwm_core.recon.gap_tv
    function: run_gap_tv
    params:
      n_bands: 28
      iterations: 50
      step: 2
    gpu: false
    reference: ''
  small_gpu:
    name: GAP-TV (small)
    module: pwm_core.recon.gap_tv
    function: run_gap_tv
    params:
      n_bands: 28
      iterations: 30
      step: 2
    gpu: false
    reference: ''
  mst_l:
    name: MST-L
    module: pwm_core.recon.mst
    function: mst_recon_cassi
    params:
      n_bands: 28
    gpu: false
    reference: Cai et al., CVPR 2022
  hdnet:
    name: HDNet
    module: pwm_core.recon.hdnet
    function: run_hdnet
    params:
      n_bands: 28
    gpu: false
    reference: Hu et al., CVPR 2022
  hsi_sdecnn:
    name: HSI-SDeCNN
    module: pwm_core.recon.hsi_sdecnn
    function: run_hsi_sdecnn
    params:
      n_bands: 28
    gpu: false
    reference: Maffei et al., TGRS 2020
metrics:
  names:
  - psnr
  - ssim
  - sam
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: Cai et al., Mask-guided Spectral-wise Transformer for Efficient Hyperspectral
      Image Reconstruction, CVPR 2022
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / cassi_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
