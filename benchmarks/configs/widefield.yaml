  license: CC-BY-4.0
mismatch_params:
- name: PSF sigma
  nominal: 2.0
  range:
  - 1.2
  - 3.5
  unit: px
- name: Background level
  nominal: 50.0
  range:
  - 0.0
  - 200.0
  unit: counts
- name: Gain
  nominal: 1.0
  range:
  - 0.85
  - 1.15
  unit: '-'
- name: Flatfield non-uniformity
  nominal: 0.0
  range:
  - 0.0
  - 15.0
  unit: peak-to-peak
- name: Photobleaching rate
  nominal: 0.0
  range:
  - 0.0
  - 0.05
  unit: per frame
solvers:
  traditional_cpu:
    name: Richardson-Lucy
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: CARE
    module: pwm_core.recon.care_unet
    function: run_care
    params: 2M
    gpu: true
    reference: Weigert et al. 2018, Nature Methods
  famous_dl:
    name: CARE
    module: pwm_core.recon.care_unet
    function: run_care
    params: 2M
    gpu: false
    reference: ''
  small_gpu:
    name: CARE
    module: pwm_core.recon.care_unet
    function: run_care
    params: '0'
    gpu: false
    reference: ''
