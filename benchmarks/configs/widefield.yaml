  pixel_size_um: 6.5
  read_noise_e: 1.6
  quantum_efficiency: 0.82
  full_well_e: 30000
  bit_depth: 16
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: biosr_factin
  dataset_url: https://figshare.com/articles/dataset/BioSR/13744429
  fallback: generated
  synthetic_generator: cell_phantom
  citation: Qiao et al., Evaluation and development of deep neural networks for image
