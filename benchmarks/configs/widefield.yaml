modality_id: widefield
display_name: Widefield Fluorescence Microscopy
category: Microscopy
canonical_dag: C --> D
carrier: Photon
maturity: M3
forward_model_type: linear_operator
default_solver: richardson_lucy
tier: A
x_shape:
- 512
- 512
y_shape:
- 512
- 512
operator_id: widefield
has_dedicated_operator: true
graph_template_id: widefield_graph_v1
theta:
