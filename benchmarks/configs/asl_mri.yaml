modality_id: asl_mri
display_name: Arterial Spin Labeling (ASL) MRI
category: Medical Imaging
canonical_dag: M --> F --> S --> D
carrier: Spin/RF
maturity: M0
forward_model_type: linear_operator
default_solver: perfusion_quantification
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: asl_mri
has_dedicated_operator: true
graph_template_id: asl_mri_graph_v1
theta:
  density: 0.5
assets: {}
category_module: medical_ct_radon
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: mri_brain
  dataset_url: https://fastmri.med.nyu.edu/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Zbontar et al., fastMRI 2018
  license: Research use
mismatch_params:
- name: Labeling efficiency
  nominal: 0.85
  range:
  - 0.6
  - 0.95
  unit: '-'
- name: Transit delay
  nominal: 1.5
  range:
  - 0.5
  - 3.0
  unit: s
- name: T1 blood error
  nominal: 0.0
  range:
  - -10.0
  - 10.0
  unit: '-'
solvers:
  traditional_cpu:
    name: FBP [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: DL-Recon [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  asl_dl:
    name: ASL-Net [proxy]
    module: pwm_core.recon.mri_solvers
    function: run_zero_filled
    params: {}
    gpu: false
    reference: ''
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: Zbontar et al., fastMRI 2018
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / asl_mri_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
