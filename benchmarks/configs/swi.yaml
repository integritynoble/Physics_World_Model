modality_id: swi
display_name: Susceptibility-Weighted Imaging (SWI)
category: Medical Imaging
canonical_dag: M --> F --> S --> D
carrier: Spin/RF
maturity: M0
forward_model_type: linear_operator
default_solver: swi_phase_mask
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: swi
has_dedicated_operator: true
graph_template_id: swi_graph_v1
theta:
  density: 0.5
assets: {}
category_module: medical_ct_radon
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: mri_brain
  dataset_url: https://fastmri.med.nyu.edu/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Zbontar et al., fastMRI 2018
  license: Research use
mismatch_params:
- name: Phase unwrapping error
  nominal: 0.0
  range:
  - 0.0
  - 5.0
  unit: '-'
- name: Background field removal error
  nominal: 0.0
  range:
  - 0.0
  - 10.0
  unit: '-'
- name: Dipole inversion regularization
  nominal: 0.0
  range:
  - 0
  - 0
  unit: '-'
solvers:
  traditional_cpu:
    name: FBP [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: DL-Recon [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  swi_dl:
    name: SWI-Net [proxy]
    module: pwm_core.recon.mri_solvers
    function: zero_filled_reconstruction
    params: {}
    gpu: false
    reference: ''
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: Zbontar et al., fastMRI 2018
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / swi_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
