modality_id: pump_probe
display_name: Pump-Probe Microscopy
category: Ultrafast Imaging
canonical_dag: M --> R --> D
carrier: Photon
maturity: M0
forward_model_type: nonlinear_operator
default_solver: transient_absorption
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: pump_probe
has_dedicated_operator: true
graph_template_id: pump_probe_graph_v1
theta:
  density: 0.5
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: tr_xds_dataset
  dataset_url: https://www.esrf.eu/home/UsersAndScience/Experiments/MX/How_to_use_our_beamlines/ID09.html
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Cammarata, M. et al. (2008) Impulsive solvent heating probed by time-resolved
    X-ray diffraction, J. Chem. Phys.
  license: Research use
mismatch_params:
- name: Time-zero drift
  nominal: 0.0
  range:
  - -100.0
  - 100.0
  unit: fs
- name: Pump power fluctuation
  nominal: 0.0
  range:
  - 0.0
  - 5.0
  unit: '-'
- name: Chirp (GDD)
  nominal: 0.0
  range:
  - -500.0
  - 500.0
  unit: fs^2
- name: Spatial overlap error
  nominal: 0.0
  range:
  - 0.0
  - 20.0
  unit: '-'
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  pp_dl:
    name: PumpProbe-Net [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 75
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / pump_probe_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
