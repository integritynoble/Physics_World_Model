modality_id: proton_therapy_img
display_name: Proton Therapy Imaging
category: Medical Imaging
canonical_dag: Pi --> D
carrier: Proton
maturity: M0
forward_model_type: nonlinear_operator
default_solver: back_projection
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: proton_therapy_img
has_dedicated_operator: true
graph_template_id: proton_therapy_img_graph_v1
theta:
  n_angles: 180
  pixel_size_um: 50.0
assets: {}
category_module: medical_ct_radon
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: proton_ct_phantom
  dataset_url: https://www.ptcog.ch/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Johnson, R.P. (2018) Review of medical radiography and tomography with
    proton beams, Rep. Prog. Phys.
  license: Research use
mismatch_params:
- name: Range uncertainty
  nominal: 0.0
  range:
  - -3.0
  - 3.0
  unit: mm
- name: Scattering power error
  nominal: 1.0
  range:
  - 0.95
  - 1.05
  unit: '-'
- name: Detector efficiency drift
  nominal: 0.85
  range:
  - 0.8
  - 0.9
  unit: '-'
- name: Setup error
  nominal: 0.0
  range:
  - -2.0
  - 2.0
  unit: mm
solvers:
  traditional_cpu:
    name: FBP [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: DL-Recon [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  proton_therapy_dl:
    name: ProtonTherapy-Net [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 75
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / proton_therapy_img_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
