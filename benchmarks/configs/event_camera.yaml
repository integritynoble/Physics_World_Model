modality_id: event_camera
display_name: Event Camera / Dynamic Vision Sensor (DVS)
category: Computational Photography
canonical_dag: M --> D
carrier: Photon
maturity: M0
forward_model_type: nonlinear_operator
default_solver: event_to_frame
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: event_camera
has_dedicated_operator: true
graph_template_id: event_camera_graph_v1
theta:
  density: 0.5
assets: {}
category_module: compressive_mask
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: hdr_dataset
  dataset_url: https://hdrplusdata.org/
  fallback: generated
  synthetic_generator: spectral_scene
  citation: Hasinoff et al., SIGGRAPH Asia 2016
  license: Research use
mismatch_params:
- name: Contrast threshold
  nominal: 0.3
  range:
  - 0.1
  - 0.5
  unit: log intensity
- name: Refractory period
  nominal: 1.0
  range:
  - 0.1
  - 10.0
  unit: us
- name: Noise event rate
  nominal: 0.0
  range:
  - 0.0
  - 1.0
  unit: of real events
- name: Hot pixel fraction
  nominal: 0.0
  range:
  - 0.0
  - 0.5
  unit: '-'
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  event_dl:
    name: E2VID+ [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 75
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
