modality_id: mfm
display_name: Magnetic Force Microscopy (MFM)
category: Scanning Probe Microscopy
canonical_dag: S --> M --> D
carrier: Magnetic
maturity: M0
forward_model_type: nonlinear_operator
default_solver: lift_mode_recon
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: mfm
has_dedicated_operator: true
graph_template_id: mfm_graph_v1
theta:
  density: 0.5
assets: {}
category_module: scanning_probe
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: afm_dataset
  dataset_url: https://www.nanosurf.com/en/application/afm-images
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Nanosurf sample images
  license: Public domain
mismatch_params:
- name: Lift height
  nominal: 50.0
  range:
  - 20.0
  - 200.0
  unit: nm
- name: Tip magnetization model
  nominal: 0.0
  range:
  - 0
  - 0
  unit: '-'
- name: Electrostatic coupling
  nominal: 0.0
  range:
  - 0.0
  - 10.0
  unit: '-'
solvers:
  traditional_cpu:
    name: Richardson-Lucy
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: CARE
    module: pwm_core.recon.care_unet
    function: care_restore_2d
    params: 2M
    gpu: true
    reference: Weigert et al. 2018
  mfm_dl:
    name: MFM-UNet
    module: pwm_core.recon.mfm_solvers
    function: mfm_dl_recon
    params: 8M
    gpu: true
    reference: Kim, M. et al. (2021) DL for magnetic force microscopy, npj Comput.
      Mater. 7:87
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: Nanosurf sample images
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / mfm_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
