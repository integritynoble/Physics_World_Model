modality_id: seismic_tomo
display_name: Seismic Tomography
category: Broader Experimental Science
canonical_dag: P --> D
carrier: Seismic
maturity: M0
forward_model_type: linear_operator
default_solver: travel_time_inversion
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: seismic_tomo
has_dedicated_operator: true
graph_template_id: seismic_tomo_graph_v1
theta: {}
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: iris_iris_seismic
  dataset_url: https://ds.iris.edu/ds/nodes/dmc/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Bensen, G.D. et al. (2007) Processing seismic ambient noise data, Geophys.
    J. Int. 169(3)
  license: CC-BY-4.0 (IRIS DMC)
mismatch_params:
- name: Velocity model error
  nominal: 5000.0
  range:
  - 4500.0
  - 5500.0
  unit: m/s
- name: Source location error
  nominal: 0.0
  range:
  - -50.0
  - 50.0
  unit: m
- name: Receiver coupling
  nominal: 1.0
  range:
  - 0.85
  - 1.15
  unit: '-'
- name: Timing error
  nominal: 0.0
  range:
  - -0.002
  - 0.002
  unit: s
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  seismic_dl:
    name: SeisInversion-Net [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 75
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / seismic_tomo_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
