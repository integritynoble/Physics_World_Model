modality_id: cryo_et
display_name: Cryo-Electron Tomography (Cryo-ET)
category: Electron Microscopy
canonical_dag: Pi --> D
carrier: Electron
maturity: M0
forward_model_type: linear_operator
default_solver: sirt
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: cryo_et
has_dedicated_operator: true
graph_template_id: cryo_et_graph_v1
theta:
  n_angles: 180
  pixel_size_um: 50.0
assets: {}
category_module: medical_ct_radon
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: cryo_et
  dataset_url: https://www.shrec.net/cryo-et/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: SHREC 2020 Challenge
  license: Public domain
mismatch_params:
- name: Tilt axis offset
  nominal: 0.0
  range:
  - -3.0
  - 3.0
  unit: px
- name: Tilt angle accuracy
  nominal: 0.0
  range:
  - -1.0
  - 1.0
  unit: deg per tilt
- name: Dose-induced shrinkage
  nominal: 0.0
  range:
  - 0.0
  - 10.0
  unit: '-'
- name: CTF per-tilt variation
  nominal: 0.0
  range:
  - 0
  - 0
  unit: um
- name: Missing wedge
  nominal: 30.0
  range:
  - 20.0
  - 50.0
  unit: deg
solvers:
  traditional_cpu:
    name: Richardson-Lucy
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: CARE
    module: pwm_core.recon.care_unet
    function: care_restore_2d
    params: 2M
    gpu: true
    reference: Weigert et al. 2018
  cryo_et_dl:
    name: CryoCARE
    module: pwm_core.recon.cryoet_solvers
    function: cryocare_recon
    params: 10M
    gpu: true
    reference: Buchholz, T.O. et al. (2019) Content-aware image restoration for cryo-EM,
      Methods Enzymol.
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: SHREC 2020 Challenge
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / cryo_et_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
