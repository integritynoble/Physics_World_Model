modality_id: adaptive_optics
display_name: Adaptive Optics (AO) Imaging
category: Broader Experimental Science
canonical_dag: M --> C --> D
carrier: Photon
maturity: M0
forward_model_type: nonlinear_operator
default_solver: psf_deconvolution
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: adaptive_optics
has_dedicated_operator: true
graph_template_id: adaptive_optics_graph_v1
theta:
  sigma: 2.0
  read_noise_e: 5.0
  pixel_size_um: 6.5
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: scexao_wfs_dataset
  dataset_url: https://www.naoj.org/Projects/SCEXAO/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Jovanovic, N. et al. (2015) SCExAO instrument, PASP 127:890
  license: Public domain (Subaru Observatory)
mismatch_params:
- name: DM actuator gain
  nominal: 1.0
  range:
  - 0.9
  - 1.1
  unit: '-'
- name: WFS centroid bias
  nominal: 0.0
  range:
  - -0.2
  - 0.2
  unit: px
- name: Fried parameter r0
  nominal: 0.15
  range:
  - 0.1
  - 0.25
  unit: m
- name: Servo lag
  nominal: 0.0
  range:
  - 0.0
  - 2.0
  unit: ms
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  deep_ao:
    name: Deep-AO [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 75
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / adaptive_optics_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
