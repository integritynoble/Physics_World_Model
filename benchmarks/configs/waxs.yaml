modality_id: waxs
display_name: Wide-Angle X-ray Scattering (WAXS)
category: Scientific Instrumentation
canonical_dag: R --> D
carrier: X-ray
maturity: M0
forward_model_type: nonlinear_operator
default_solver: azimuthal_integration
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: waxs
has_dedicated_operator: true
graph_template_id: waxs_graph_v1
theta:
  sigma: 2.0
  read_noise_e: 5.0
  pixel_size_um: 6.5
assets: {}
category_module: remote_sensing_sar
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: cxidb_waxs_dataset
  dataset_url: https://cxidb.org/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Maia, F.R.N.C. (2012) The Coherent X-ray Imaging Data Bank, Nature Methods
    9:854
  license: CC0 (CXIDB)
mismatch_params:
- name: Detector distance error
  nominal: 0.0
  range:
  - -1.0
  - 1.0
  unit: '-'
- name: Beam center error
  nominal: 0.0
  range:
  - 0.0
  - 3.0
  unit: px
- name: Polarization correction
  nominal: 1.0
  range:
  - 0.9
  - 1.0
  unit: '-'
- name: Air scatter background
  nominal: 0.0
  range:
  - 0.0
  - 5.0
  unit: '-'
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  waxs_dl:
    name: WAXS-Net [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 75
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / waxs_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
