modality_id: nsom
display_name: Near-field Scanning Optical Microscopy (NSOM)
category: Scanning Probe Microscopy
canonical_dag: M --> C --> D
carrier: Photon
maturity: M0
forward_model_type: nonlinear_operator
default_solver: near_field_recon
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: nsom
has_dedicated_operator: true
graph_template_id: nsom_graph_v1
theta:
  sigma: 2.0
  read_noise_e: 5.0
  pixel_size_um: 6.5
assets: {}
category_module: scanning_probe
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: afm_dataset
  dataset_url: https://www.nanosurf.com/en/application/afm-images
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Nanosurf sample images
  license: Public domain
mismatch_params:
- name: Tip-sample distance
  nominal: 10.0
  range:
  - 5.0
  - 50.0
  unit: nm
- name: Aperture size error
  nominal: 0.0
  range:
  - -20.0
  - 20.0
  unit: '-'
- name: Topographic coupling
  nominal: 0.0
  range:
  - 0.0
  - 30.0
  unit: '-'
- name: Far-field background
  nominal: 0.0
  range:
  - 0.0
  - 20.0
  unit: '-'
solvers:
  traditional_cpu:
    name: Richardson-Lucy
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: CARE
    module: pwm_core.recon.care_unet
    function: care_restore_2d
    params: 2M
    gpu: true
    reference: Weigert et al. 2018
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: Nanosurf sample images
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / nsom_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
