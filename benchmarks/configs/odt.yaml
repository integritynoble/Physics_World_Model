modality_id: odt
display_name: Optical Diffraction Tomography (ODT)
category: Coherent Imaging
canonical_dag: P --> D
carrier: Photon
maturity: M0
forward_model_type: nonlinear_operator
default_solver: rytov_inversion
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: odt
has_dedicated_operator: true
graph_template_id: odt_graph_v1
theta: {}
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: odt_cells_dataset
  dataset_url: https://doi.org/10.1038/s41592-019-0539-7
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Sung, Y. et al. (2009) Optical diffraction tomography for high resolution
    3D imaging, Opt. Express
  license: Research use
mismatch_params:
- name: Illumination angle error
  nominal: 0.0
  range:
  - -2.0
  - 2.0
  unit: deg per angle
- name: Missing cone artifact
  nominal: 30.0
  range:
  - 20.0
  - 50.0
  unit: deg
- name: Refractive index of medium
  nominal: 1.337
  range:
  - 1.33
  - 1.35
  unit: '-'
- name: Multiple scattering
  nominal: 0.0
  range:
  - 0.0
  - 10.0
  unit: '-'
solvers:
  traditional_cpu:
    name: Adjoint
    module: pwm_core.recon.adjoint
    function: run_adjoint
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: PnP-ADMM
    module: pwm_core.recon.pnp_admm
    function: pnp_admm_recon
    params: 2M
    gpu: true
    reference: ''
  odt_dl:
    name: ODT-Net (PhaseNet)
    module: pwm_core.recon.odt_solvers
    function: phase_net_recon
    params: 10M
    gpu: true
    reference: 'Rivenson, Y. et al. (2018) Phase recovery and holographic image reconstruction
      with DL, Light: Sci. & Appl. 7:17141'
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / odt_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
