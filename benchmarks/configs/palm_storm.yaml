expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: 'Sage et al., Super-resolution fight club: assessment of 2D and 3D
      single-molecule localization microscopy software, Nature Methods 2019'
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / palm_storm_graph_v2
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
