modality_id: palm_storm
display_name: PALM/STORM Single-Molecule Localization
category: Microscopy
canonical_dag: M --> D
carrier: Photon
maturity: M0
forward_model_type: nonlinear_operator
default_solver: thunderstorm
tier: A
x_shape:
- 512
- 512
y_shape:
- 512
- 512
operator_id: palm_storm
has_dedicated_operator: true
graph_template_id: palm_storm_graph_v2
theta:
  type: EMCCD
  wavelength_nm: 647
  power_mw: 50
  magnification: 100
  numerical_aperture: 1.49
  psf_sigma_px: 1.3
  immersion: oil
  quantum_efficiency: 0.9
  em_gain: 300
  read_noise_e: 50
  pixel_size_um: 16
  bit_depth: 16
assets: {}
category_module: compressive_mask
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: smlm_challenge_2016
  dataset_url: http://bigwww.epfl.ch/smlm/challenge2016/datasets/
  fallback: generated
  synthetic_generator: spectral_scene
  citation: 'Sage et al., Super-resolution fight club: assessment of 2D and 3D single-molecule
    localization microscopy software, Nature Methods 2019'
  license: CC-BY-4.0
mismatch_params:
- name: Drift rate (x, y)
  nominal: 0.0
  range:
  - 0.0
  - 2.0
  unit: nm/frame
- name: Background photons
  nominal: 20.0
  range:
  - 5.0
  - 100.0
  unit: per px
- name: Photon count/event
  nominal: 1000.0
  range:
  - 200.0
  - 5000.0
  unit: photons
- name: Pixel size
  nominal: 100.0
  range:
  - 90.0
  - 110.0
  unit: nm
solvers:
  traditional_cpu:
    name: Richardson-Lucy (STORM/PALM)
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: DECODE-SMLM
    module: pwm_core.recon.smlm_solvers
    function: decode_smlm_recon
    params: 4M
    gpu: true
    reference: Speiser, A. et al. (2021) Deep learning enables fast and dense SMLM,
      Nature Methods 18:1090
  famous_dl:
    name: DeepSTORM
    module: pwm_core.recon.smlm_solvers
    function: deep_storm_recon
    params: 2M
    gpu: true
    reference: 'Nehme, E. et al. (2018) Deep-STORM: super-resolution microscopy, Optica
      5(4)'
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
