modality_id: impedance_tomo
display_name: Electrical Impedance Tomography (EIT)
category: Broader Experimental Science
canonical_dag: M --> D
carrier: Electric
maturity: M0
forward_model_type: nonlinear_operator
default_solver: gauss_newton
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: impedance_tomo
has_dedicated_operator: true
graph_template_id: impedance_tomo_graph_v1
theta:
  density: 0.5
assets: {}
category_module: compressive_mask
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: eit_chest_dataset
  dataset_url: https://github.com/eitcom/pyEIT
  fallback: generated
  synthetic_generator: spectral_scene
  citation: 'Liu, B. et al. (2018) pyEIT: A Python based framework for EIT, SoftwareX
    7'
  license: Apache 2.0
mismatch_params:
- name: Contact impedance
  nominal: 100.0
  range:
  - 50.0
  - 200.0
  unit: ohm
- name: Electrode position error
  nominal: 0.0
  range:
  - -2.0
  - 2.0
  unit: mm
- name: Background conductivity
  nominal: 0.2
  range:
  - 0.1
  - 0.4
  unit: S/m
- name: Current amplitude drift
  nominal: 1.0
  range:
  - 0.95
  - 1.05
  unit: '-'
solvers:
  traditional_cpu:
    name: Adjoint
    module: pwm_core.recon.adjoint
    function: run_adjoint
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: PnP-ADMM
    module: pwm_core.recon.pnp_admm
    function: pnp_admm_recon
    params: 2M
    gpu: true
    reference: ''
  eit_dl:
    name: EIT-Net
    module: pwm_core.recon.eit_solvers
    function: eit_net_recon
    params: 7M
    gpu: false
    reference: Hamilton, S.J. & Hauptmann, A. (2018) DL in electrical impedance tomography,
      IEEE TMI 37(12)
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / impedance_tomo_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
