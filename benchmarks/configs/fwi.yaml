modality_id: fwi
display_name: Full-Waveform Inversion (FWI)
category: Broader Experimental Science
canonical_dag: P --> D
carrier: Seismic/Acoustic
maturity: M0
forward_model_type: nonlinear_operator
default_solver: adjoint_state
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: fwi
has_dedicated_operator: true
graph_template_id: fwi_graph_v1
theta: {}
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: openfwi_dataset
  dataset_url: https://openfwi-lanl.github.io/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: 'Deng, C. et al. (2022) OpenFWI: Large-scale multi-structural benchmark
    datasets, NeurIPS'
  license: CC-BY-4.0
mismatch_params:
- name: Starting velocity model error
  nominal: 0.0
  range:
  - -15.0
  - 15.0
  unit: '-'
- name: Source wavelet error
  nominal: 0.0
  range:
  - -10.0
  - 10.0
  unit: '-'
- name: Anelastic attenuation (Q)
  nominal: 0.0
  range:
  - 50.0
  - 500.0
  unit: '-'
- name: Source location error
  nominal: 0.0
  range:
  - 0.0
  - 100.0
  unit: m
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: &id001
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  fwi_dl:
    name: InversionNet [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: *id001
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / fwi_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
