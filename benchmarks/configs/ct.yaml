modality_id: ct
display_name: X-ray Computed Tomography (CT)
category: Medical Imaging
canonical_dag: Pi --> D
carrier: X-ray
maturity: M3
forward_model_type: linear_operator
default_solver: fbp
tier: A
x_shape:
- 256
- 256
y_shape:
- 180
- 256
operator_id: ct
has_dedicated_operator: true
graph_template_id: ct_graph_v1
theta:
  tube_voltage_kvp: 120
  tube_current_ma: 200
  focal_spot_mm: 0.6
  spectrum: polychromatic
  type: fan_beam
  fan_angle_deg: 50
  slice_thickness_mm: 1.0
  mean_attenuation_coefficient: 0.2
  n_angles: 180
  angular_range_deg: 180
  grid_ratio: 12
  n_detectors: 512
  detector_pitch_mm: 1.0
  scintillator: CsI
  bit_depth: 20
assets: {}
category_module: medical_ct_radon
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: lodopab_ct
  dataset_url: https://zenodo.org/record/3384092
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Leuschner et al., LoDoPaB-CT, a benchmark dataset for low-dose computed
    tomography reconstruction, Scientific Data 2021
  license: CC-BY-4.0
mismatch_params:
- name: Center-of-rotation offset
  nominal: 0.0
  range:
  - -5.0
  - 5.0
  unit: px
- name: Angular offset
  nominal: 0.0
  range:
  - -3.0
  - 3.0
  unit: deg
- name: Detector tilt
  nominal: 0.0
  range:
  - -2.0
  - 2.0
  unit: deg
- name: Beam hardening coeff
  nominal: 0.0
  range:
  - 0.0
  - 0.05
  unit: '-'
- name: Ring artifact amplitude
  nominal: 0.0
  range:
  - 0.0
  - 50.0
  unit: counts
solvers:
  traditional_cpu:
    name: FBP
    module: pwm_core.recon.ct_solvers
    function: run_fbp
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: PnP-HQS + NLM
    module: pwm_core.recon.pnp
    function: run_pnp
    params:
      algorithm: hqs
      denoiser: nlm
      iters: 20
    gpu: false
    reference: ''
  famous_dl:
    name: RED-CNN
    module: pwm_core.recon.redcnn
    function: run_redcnn
    params: 1.5M
    gpu: false
    reference: Chen et al. 2017, IEEE TMI
  small_gpu:
    name: RED-CNN
    module: pwm_core.recon.redcnn
    function: run_redcnn
    params: '0'
    gpu: false
    reference: ''
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: Leuschner et al., LoDoPaB-CT, a benchmark dataset for low-dose computed
      tomography reconstruction, Scientific Data 2021
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / ct_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
