modality_id: hdr_imaging
display_name: High Dynamic Range (HDR) Imaging
category: Computational Photography
canonical_dag: M --> Sigma --> D
carrier: Photon
maturity: M0
forward_model_type: nonlinear_operator
default_solver: hdr_merge
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: hdr_imaging
has_dedicated_operator: true
graph_template_id: hdr_imaging_graph_v1
theta:
  density: 0.5
assets: {}
category_module: compressive_mask
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: hdr_dataset
  dataset_url: https://hdrplusdata.org/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Hasinoff et al., SIGGRAPH Asia 2016
  license: Research use
mismatch_params:
- name: Camera response function error
  nominal: 0.0
  range:
  - 0.0
  - 10.0
  unit: '-'
- name: Exposure ratio error
  nominal: 0.0
  range:
  - -10.0
  - 10.0
  unit: '-'
- name: Ghost artifact (motion between exposures)
  nominal: 0.0
  range:
  - 0.0
  - 5.0
  unit: px
solvers:
  traditional_cpu:
    name: Adjoint
    module: pwm_core.recon.adjoint
    function: run_adjoint
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: PnP-ADMM
    module: pwm_core.recon.pnp_admm
    function: pnp_admm_recon
    params: 2M
    gpu: true
    reference: ''
  hdr_dl:
    name: HDR-Net
    module: pwm_core.recon.hdr_solvers
    function: hdr_net_recon
    params: 18M
    gpu: true
    reference: Eilertsen, G. et al. (2017) HDR image reconstruction from single exposures,
      ACM TOG 36(6)
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: Hasinoff et al., SIGGRAPH Asia 2016
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / hdr_imaging_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
