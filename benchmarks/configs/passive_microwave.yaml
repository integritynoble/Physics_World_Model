modality_id: passive_microwave
display_name: Passive Microwave Radiometry
category: Remote Sensing
canonical_dag: Sigma --> D
carrier: RF
maturity: M0
forward_model_type: linear_operator
default_solver: deconvolution
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: passive_microwave
has_dedicated_operator: true
graph_template_id: passive_microwave_graph_v1
theta: {}
assets: {}
category_module: remote_sensing_sar
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: ssmi_brightness_temperature
  dataset_url: https://nsidc.org/data/nsidc-0001
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Cavalieri, D.J. et al. (1996) DMSP SSM/I-SSMIS Passive Microwave Data,
    NSIDC
  license: Public domain (NASA/NSIDC)
mismatch_params:
- name: Antenna beam width error
  nominal: 0.0
  range:
  - -0.5
  - 0.5
  unit: deg
- name: Receiver gain drift
  nominal: 1.0
  range:
  - 0.95
  - 1.05
  unit: '-'
- name: Brightness temperature offset
  nominal: 0.0
  range:
  - -2.0
  - 2.0
  unit: K
- name: Cross-polarization leakage
  nominal: 0.0
  range:
  - 0.0
  - 0.02
  unit: '-'
solvers:
  traditional_cpu:
    name: RDA
    module: pwm_core.recon.sar_rda
    function: range_doppler
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: SAR-DL
    module: pwm_core.recon.sar_dl
    function: sar_dl_recon
    params: 5M
    gpu: true
    reference: ''
  pm_dl:
    name: PM-Net
    module: pwm_core.recon.passive_mw_solvers
    function: pm_dl_recon
    params: 15M
    gpu: true
    reference: Ebtehaj, A. & Kummerow, C. (2021) DL precipitation retrieval, J. Atmos.
      Sci. 78(1)
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / passive_microwave_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
