modality_id: machine_vision
display_name: Machine Vision / AOI
category: Industrial Inspection
canonical_dag: C --> D
carrier: Photon
maturity: M0
forward_model_type: linear_operator
default_solver: defect_detection
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: machine_vision
has_dedicated_operator: true
graph_template_id: machine_vision_graph_v1
theta:
  sigma: 2.0
  read_noise_e: 5.0
  pixel_size_um: 6.5
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: mvtec_ad
  dataset_url: https://www.mvtec.com/company/research/datasets/mvtec-ad
  fallback: generated
  synthetic_generator: cell_phantom
  citation: 'Bergmann, P. et al. (2019) MVTec AD: Comprehensive Real-World Dataset,
    CVPR'
  license: CC-BY-NC 4.0 (MVTec)
mismatch_params:
- name: Focus distance error
  nominal: 0.0
  range:
  - -5.0
  - 5.0
  unit: mm
- name: Lens distortion k1
  nominal: 0.0
  range:
  - -0.1
  - 0.1
  unit: '-'
- name: Exposure time drift
  nominal: 10.0
  range:
  - 8.0
  - 12.0
  unit: ms
- name: White balance gain
  nominal: 1.0
  range:
  - 0.9
  - 1.1
  unit: '-'
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: &id001
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  mv_dl:
    name: PatchCore [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: *id001
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / machine_vision_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
