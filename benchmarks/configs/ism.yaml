modality_id: ism
display_name: Image Scanning Microscopy (ISM)
category: Microscopy
canonical_dag: C --> D
carrier: Photon
maturity: M0
forward_model_type: linear_operator
default_solver: pixel_reassignment
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: ism
has_dedicated_operator: true
graph_template_id: ism_graph_v1
theta:
  sigma: 2.0
  read_noise_e: 5.0
  pixel_size_um: 6.5
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: ism_beads_dataset
  dataset_url: https://doi.org/10.1038/s41592-018-0291-9
  fallback: generated
  synthetic_generator: cell_phantom
  citation: Castello, M. et al. (2019) Image scanning microscopy with ISM, Nature
    Methods 16:175
  license: Research use
mismatch_params:
- name: Detector element offset
  nominal: 0.0
  range:
  - -1.0
  - 1.0
  unit: px
- name: Magnification error
  nominal: 0.0
  range:
  - -5.0
  - 5.0
  unit: relative
solvers:
  traditional_cpu:
    name: Richardson-Lucy
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: CARE
    module: pwm_core.recon.care_unet
    function: run_care
    params: 2M
    gpu: true
    reference: Weigert et al. 2018
  ism_dl:
    name: ISM-Reassignment-Net
    module: pwm_core.recon.ism_solvers
    function: ism_dl_recon
    params: 8M
    gpu: true
    reference: Castello, M. et al. (2019) Image scanning microscopy ISM, Nature Methods
      16:175
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / ism_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
