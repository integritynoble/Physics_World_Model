modality_id: spectral_ct
display_name: Photon-Counting Spectral CT
category: Medical Imaging
canonical_dag: Pi --> W --> D
carrier: X-ray
maturity: M0
forward_model_type: linear_operator
default_solver: material_decomposition
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: spectral_ct
has_dedicated_operator: true
graph_template_id: spectral_ct_graph_v1
theta:
  n_angles: 180
  pixel_size_um: 50.0
assets: {}
category_module: medical_ct_radon
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: spectral_ct_phantom
  dataset_url: https://doi.org/10.1118/1.4863345
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Schlomka, J.P. et al. (2008) Experimental feasibility of spectral CT with
    photon-counting detectors, Phys. Med. Biol.
  license: Research use
mismatch_params:
- name: Energy threshold calibration
  nominal: 0.0
  range:
  - -2.0
  - 2.0
  unit: keV per bin
- name: Charge sharing fraction
  nominal: 0.0
  range:
  - 0.0
  - 15.0
  unit: '-'
- name: Pile-up at high flux
  nominal: 0.0
  range:
  - 0.0
  - 10.0
  unit: '-'
- name: Material decomposition basis error
  nominal: 0.0
  range:
  - 0.0
  - 5.0
  unit: '-'
solvers:
  traditional_cpu:
    name: FBP [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: &id001
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: DL-Recon [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  spectral_ct_dl:
    name: SpectralCT-Net [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params: *id001
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / spectral_ct_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
