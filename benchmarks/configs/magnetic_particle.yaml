modality_id: magnetic_particle
display_name: Magnetic Particle Imaging (MPI)
category: Broader Experimental Science
canonical_dag: M --> F --> D
carrier: Magnetic
maturity: M0
forward_model_type: linear_operator
default_solver: system_function_inversion
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: magnetic_particle
has_dedicated_operator: true
graph_template_id: magnetic_particle_graph_v1
theta:
  density: 0.5
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: mpi_openmpitomography
  dataset_url: https://www.openmpitomography.de/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: 'Knopp, T. et al. (2020) MPI: From proof of principle to preclinical applications,
    Phys. Med. Biol.'
  license: CC-BY-4.0 (OpenMPI)
mismatch_params:
- name: Drive field amplitude
  nominal: 25.0
  range:
  - 22.0
  - 28.0
  unit: mT
- name: Selection field gradient
  nominal: 2.5
  range:
  - 2.0
  - 3.0
  unit: T/m
- name: Particle relaxation time
  nominal: 2.0
  range:
  - 1.0
  - 3.0
  unit: us
- name: Receive coil sensitivity
  nominal: 1.0
  range:
  - 0.85
  - 1.15
  unit: '-'
solvers:
  traditional_cpu:
    name: Adjoint
    module: pwm_core.recon.adjoint
    function: run_adjoint
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: PnP-ADMM
    module: pwm_core.recon.pnp_admm
    function: pnp_admm_recon
    params: 2M
    gpu: true
    reference: ''
  mpi_dl:
    name: MPI-Net
    module: pwm_core.recon.mpi_solvers
    function: mpi_net_recon
    params: 10M
    gpu: true
    reference: Dittmer, S. et al. (2021) DL for MPI reconstruction, Int. J. Magn.
      Part. Imaging 7(1)
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / magnetic_particle_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
