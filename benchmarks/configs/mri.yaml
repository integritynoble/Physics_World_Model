modality_id: mri
display_name: Magnetic Resonance Imaging (MRI)
category: Medical Imaging
canonical_dag: M --> F --> S --> D
carrier: Spin/RF
maturity: M3
forward_model_type: linear_operator
default_solver: sense
tier: A
x_shape:
- 320
- 320
y_shape:
- 320
- 320
operator_id: mri
has_dedicated_operator: true
graph_template_id: mri_graph_v1
theta:
  field_strength_T: 3.0
  homogeneity_ppm: 0.5
  bore_diameter_cm: 60
  type: body_coil
  flip_angle_deg: 90
  pulse_shape: sinc
  bandwidth_hz: 125000
  max_gradient_mt_per_m: 45
  slew_rate_t_per_m_per_s: 200
  undersampling_pattern: variable_density
  sampling_rate: 0.25
  center_fraction: 0.08
  n_coils: 8
  coil_type: phased_array
  noise_figure_db: 0.5
  bit_depth: 16
assets: {}
category_module: medical_ct_radon
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: fastmri_knee
  dataset_url: https://fastmri.med.nyu.edu/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: 'Zbontar et al., fastMRI: An Open Dataset and Benchmarks for Accelerated
    MRI, arXiv 2018'
  license: fastMRI Dataset License
mismatch_params:
- name: Coil sensitivity error
  nominal: 0.0
  range:
  - 0.0
  - 15.0
  unit: relative
- name: k-space trajectory deviation
  nominal: 0.0
  range:
  - 0.0
  - 2.0
  unit: '-'
- name: Off-resonance (B0)
  nominal: 0.0
  range:
  - -100.0
  - 100.0
  unit: Hz
- name: Acceleration factor
  nominal: 0.0
  range:
  - 2.0
  - 8.0
  unit: '-'
solvers:
  traditional_cpu:
    name: Zero-Filled IFFT
    module: pwm_core.recon.mri_solvers
    function: run_zero_filled
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: CS-MRI (Wavelet)
    module: pwm_core.recon.mri_solvers
    function: run_cs_mri
    params:
      lam: 0.01
      iters: 50
    gpu: false
    reference: Lustig et al. 2007, MRM
  famous_dl:
    name: MoDL
    module: pwm_core.recon.modl
    function: run_modl
    params: 2M
    gpu: false
    reference: Aggarwal et al. 2019, IEEE TMI
  small_gpu:
    name: MoDL (5 unrolls)
    module: pwm_core.recon.modl
    function: run_modl
    params: '0'
    gpu: false
    reference: ''
  sense:
    name: SENSE
    module: pwm_core.recon.mri_solvers
    function: run_sense
    params: {}
    gpu: false
    reference: Pruessmann et al., MRM 1999
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: 'Zbontar et al., fastMRI: An Open Dataset and Benchmarks for Accelerated
      MRI, arXiv 2018'
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / mri_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
