modality_id: mri
display_name: Magnetic Resonance Imaging (MRI)
category: Medical Imaging
canonical_dag: M --> F --> S --> D
carrier: Spin/RF
maturity: M3
forward_model_type: linear_operator
default_solver: sense
tier: A
x_shape:
- 320
- 320
y_shape:
- 320
- 320
operator_id: mri
has_dedicated_operator: true
graph_template_id: mri_graph_v1
theta:
  field_strength_T: 3.0
  homogeneity_ppm: 0.5
  bore_diameter_cm: 60
  type: body_coil
  flip_angle_deg: 90
  pulse_shape: sinc
  bandwidth_hz: 125000
  max_gradient_mt_per_m: 45
  slew_rate_t_per_m_per_s: 200
  undersampling_pattern: variable_density
  sampling_rate: 0.25
  center_fraction: 0.08
  n_coils: 8
  coil_type: phased_array
  noise_figure_db: 0.5
  bit_depth: 16
assets: {}
category_module: medical_mri_kspace
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: fastmri_knee
  dataset_url: https://fastmri.med.nyu.edu/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: 'Zbontar et al., fastMRI: An Open Dataset and Benchmarks for Accelerated
    MRI, arXiv 2018'
  license: fastMRI Dataset License
mismatch_params:
- name: Coil sensitivity error
  nominal: 0.0
  range:
  - 0.0
  - 15.0
  unit: relative
- name: k-space trajectory deviation
  nominal: 0.0
  range:
  - 0.0
  - 2.0
  unit: '-'
- name: Off-resonance (B0)
  nominal: 0.0
  range:
  - -100.0
  - 100.0
  unit: Hz
- name: Acceleration factor
  nominal: 0.0
  range:
  - 2.0
  - 8.0
  unit: '-'
solvers:
  traditional_cpu:
    name: Zero-Filled IFFT
    module: pwm_core.recon.mri_solvers
    function: run_zero_filled
    params: {}
    gpu: false
    reference: Lauterbur, Nature 1973
  best_quality:
    name: CS-MRI (Wavelet)
    module: pwm_core.recon.mri_solvers
    function: run_cs_mri
    params: {}
    gpu: false
    reference: Lustig et al., MRM 2007 — 33.0 dB on fastMRI knee 4x
  sense:
    name: SENSE
    module: pwm_core.recon.mri_solvers
    function: run_sense
    params: {}
    gpu: false
    reference: Pruessmann et al., MRM 1999
  espirit:
    name: ESPIRiT
    module: pwm_core.recon.mri_solvers
    function: run_espirit_recon
    params: {}
    gpu: false
    reference: Uecker et al., MRM 2014 — 34.2 dB on fastMRI knee 4x
  cs_tv:
    name: CS-MRI (TV)
    module: pwm_core.recon.mri_solvers
    function: run_tv_mri
    params: {}
    gpu: false
    reference: Block et al., MRM 2007
  pocs:
    name: POCS
    module: pwm_core.recon.mri_solvers
    function: run_pocs
    params: {}
    gpu: false
    reference: Haacke et al., MRM 1991
  admm_mri:
    name: ADMM
    module: pwm_core.recon.mri_solvers
    function: run_admm_mri
    params: {}
    gpu: false
    reference: Yang et al., MRM 2010
  conjugate_gradient:
    name: Conjugate Gradient
    module: pwm_core.recon.mri_solvers
    function: run_conjugate_gradient
    params: {}
    gpu: false
    reference: Pruessmann et al., MRM 2001
  truncated_ifft:
    name: Truncated IFFT
    module: pwm_core.recon.mri_solvers
    function: run_truncated_ifft
    params: {}
    gpu: false
    reference: Classic Fourier MRI, Lauterbur 1973
  gradient_descent:
    name: Gradient Descent
    module: pwm_core.recon.mri_solvers
    function: run_gradient_descent
    params: {}
    gpu: false
    reference: Fessler, IEEE SPM 2010
  split_bregman:
    name: Split Bregman
    module: pwm_core.recon.mri_solvers
    function: run_split_bregman
    params: {}
    gpu: false
    reference: Goldstein & Osher, SIAM J Imaging Sci 2009
  pnp_admm:
    name: PnP-ADMM
    module: pwm_core.recon.mri_solvers
    function: run_pnp_mri
    params: {}
    gpu: false
    reference: Ahmad et al., IEEE SPM 2020
  low_rank:
    name: Low-Rank
    module: pwm_core.recon.mri_solvers
    function: run_low_rank
    params: {}
    gpu: false
    reference: Haldar, IEEE TMI 2014 — LORAKS
  ista_mri:
    name: ISTA
    module: pwm_core.recon.mri_solvers
    function: run_ista_mri
    params: {}
    gpu: false
    reference: Daubechies et al., 2004; Beck & Teboulle, 2009
  grappa_like:
    name: GRAPPA-like
    module: pwm_core.recon.mri_solvers
    function: run_grappa_like
    params: {}
    gpu: false
    reference: Griswold et al., MRM 2002
  famous_dl:
    name: MoDL
    module: pwm_core.recon.modl
    function: run_modl
    params: {}
    gpu: true
    reference: Aggarwal et al., IEEE TMI 2019 — 36.0 dB on fastMRI knee 4x
  small_gpu:
    name: MoDL (5 unrolls)
    module: pwm_core.recon.modl
    function: run_modl
    params:
      n_iter: 5
    gpu: true
    reference: Aggarwal et al., IEEE TMI 2019
  varnet:
    name: E2E-VarNet
    module: pwm_core.recon.varnet
    function: run_varnet
    params: {}
    gpu: true
    reference: Sriram et al., MICCAI 2020 — 40.5 dB on fastMRI knee 4x
  fista_mri:
    name: FISTA
    module: pwm_core.recon.mri_solvers
    function: run_fista_mri
    params: {}
    gpu: false
    reference: Beck & Teboulle, SIAM J Imaging Sci 2009
  landweber:
    name: Landweber Iteration
    module: pwm_core.recon.mri_solvers
    function: run_landweber
    params: {}
    gpu: false
    reference: Landweber, Amer J Math 1951
  tikhonov:
    name: Tikhonov Regularization
    module: pwm_core.recon.mri_solvers
    function: run_tikhonov
    params: {}
    gpu: false
    reference: Tikhonov, Soviet Math Dokl 1963
  homodyne:
    name: Homodyne Detection
    module: pwm_core.recon.mri_solvers
    function: run_homodyne
    params: {}
    gpu: false
    reference: Noll, Nishimura, Macovski, IEEE TMI 1991
  nuclear_norm:
    name: Nuclear Norm (SVT)
    module: pwm_core.recon.mri_solvers
    function: run_nuclear_norm
    params: {}
    gpu: false
    reference: Cai, Candes, Shen, SIAM J Optim 2010; Shin et al., MRM 2014 (SAKE)
  proximal_gradient:
    name: Proximal Gradient Descent
    module: pwm_core.recon.mri_solvers
    function: run_proximal_gradient
