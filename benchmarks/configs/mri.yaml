  ista_net_plus:
    name: ISTA-Net+
    module: pwm_core.recon.mri_solvers
    function: run_ista_net_plus
    params: {}
    gpu: true
    reference: Zhang & Ghanem, CVPR 2018
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: 'Zbontar et al., fastMRI: An Open Dataset and Benchmarks for Accelerated
      MRI, arXiv 2018'
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / mri_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
