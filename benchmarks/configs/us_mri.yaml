modality_id: us_mri
display_name: US/MRI Fusion
category: Multi-Modal Fusion
canonical_dag: P --> D (US) + M --> F --> S --> D (MR) --> Fusion
carrier: Acoustic
maturity: M0
forward_model_type: nonlinear_operator
default_solver: registration_fusion
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: us_mri
has_dedicated_operator: true
graph_template_id: us_mri_graph_v1
theta:
  density: 0.5
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: musculoskeletal_ultrasound_mri
  dataset_url: https://doi.org/10.1016/j.media.2021.102143
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Knobe, M. et al. (2022) Ultrasound-MRI co-registration for musculoskeletal
    imaging, Med. Image Anal.
  license: Research use
mismatch_params:
- name: Registration error (deformable)
  nominal: 0.0
  range:
  - 0.0
  - 10.0
  unit: mm
- name: Probe pressure deformation
  nominal: 0.0
  range:
  - 0.0
  - 15.0
  unit: mm
- name: MR distortion
  nominal: 0.0
  range:
  - 0.0
  - 5.0
  unit: mm
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  us_mri_dl:
    name: US-MRI-Net [proxy]
    module: pwm_core.recon.mri_solvers
    function: zero_filled_reconstruction
    params: {}
    gpu: false
    reference: ''
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / us_mri_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
