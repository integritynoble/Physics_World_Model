modality_id: srs
display_name: Stimulated Raman Scattering (SRS) Microscopy
category: Spectroscopy & Spectral Imaging
canonical_dag: M --> R --> D
carrier: Photon
maturity: M0
forward_model_type: nonlinear_operator
default_solver: lock_in_demod
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: srs
has_dedicated_operator: true
graph_template_id: srs_graph_v1
theta:
  density: 0.5
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: raman_dataset
  dataset_url: https://rruff.info/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: RRUFF Project, Univ. Arizona
  license: Public domain
mismatch_params:
- name: Lock-in phase error
  nominal: 0.0
  range:
  - -10.0
  - 10.0
  unit: deg
- name: Cross-phase modulation
  nominal: 0.0
  range:
  - 0.0
  - 5.0
  unit: '-'
- name: Laser intensity noise (RIN)
  nominal: -150.0
  range:
  - -160.0
  - -140.0
  unit: dBc/Hz
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  srs_dl:
    name: SRS-DeepSpec [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 75
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: RRUFF Project, Univ. Arizona
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / srs_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
