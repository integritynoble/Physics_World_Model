modality_id: cars
display_name: Coherent Anti-Stokes Raman (CARS) Microscopy
category: Spectroscopy & Spectral Imaging
canonical_dag: M --> R --> D
carrier: Photon
maturity: M0
forward_model_type: nonlinear_operator
default_solver: nrb_removal
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: cars
has_dedicated_operator: true
graph_template_id: cars_graph_v1
theta:
  density: 0.5
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: raman_dataset
  dataset_url: https://rruff.info/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: RRUFF Project, Univ. Arizona
  license: Public domain
mismatch_params:
- name: Pump-Stokes frequency offset
  nominal: 0.0
  range:
  - -5.0
  - 5.0
  unit: cm^-1
- name: Non-resonant background
  nominal: 0.0
  range:
  - 0.0
  - 50.0
  unit: '-'
- name: Chirp mismatch
  nominal: 0.0
  range:
  - 0.0
  - 500.0
  unit: fs^2
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  cars_dl:
    name: CARS-DeepSpec [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 75
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: RRUFF Project, Univ. Arizona
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / cars_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
