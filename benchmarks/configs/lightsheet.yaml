modality_id: lightsheet
display_name: Light-Sheet Fluorescence Microscopy (LSFM)
category: Microscopy
canonical_dag: C --> D
carrier: Photon
maturity: M1
forward_model_type: linear_operator
default_solver: fourier_notch_destripe
tier: A
x_shape:
- 512
- 512
- 128
y_shape:
- 512
- 512
- 128
operator_id: lightsheet
has_dedicated_operator: true
graph_template_id: lightsheet_graph_v1
theta:
  type: laser
  wavelength_nm: 488
  power_mw: 10
  sheet_thickness_um: 4.0
  sheet_width_um: 500
  rayleigh_length_um: 200
  refractive_index: 1.33
  scattering_mean_free_path_um: 100
  stripe_strength: 0.2
  attenuation_coef: 0.02
  magnification: 20
  numerical_aperture: 1.0
  psf_sigma_lateral_px: 1.5
  psf_sigma_axial_px: 1.0
  immersion: water
  pixel_size_um: 6.5
  read_noise_e: 1.6
  quantum_efficiency: 0.82
  bit_depth: 16
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: openspim_demo
  dataset_url: https://openspim.org/downloads
  fallback: generated
  synthetic_generator: cell_phantom
  citation: 'Pitrone et al., OpenSPIM: an open-access light-sheet microscopy platform, Nature Methods 2013'
  license: CC-BY-SA-4.0
mismatch_params:
- name: Sheet thickness
  nominal: 5.0
  range:
  - 2.0
  - 15.0
  unit: um
- name: Sheet tilt
  nominal: 0.0
  range:
  - -3.0
  - 3.0
  unit: deg
- name: Stripe strength
  nominal: 0.2
  range:
  - 0.0
  - 0.8
  unit: relative
- name: Attenuation coeff
  nominal: 0.02
  range:
  - 0.005
  - 0.08
  unit: per slice
solvers:
  traditional_cpu:
    name: Fourier Notch Filter
    module: pwm_core.recon.lightsheet_solver
    function: run_lightsheet
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: VSNR
    module: pwm_core.recon.lightsheet_solver
    function: vsnr_destripe
    params: '0'
    gpu: false
    reference: ''
  famous_dl:
    name: DeStripe
    module: pwm_core.recon.destripe_net
    function: destripe_denoise
    params: 2M
    gpu: false
    reference: Liang et al. 2022
  small_gpu:
    name: DeStripe
    module: pwm_core.recon.destripe_net
    function: destripe_denoise
    params: '0'
    gpu: false
    reference: ''
metrics:
  names:
  - psnr
  - ssim
  - sam
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: 'Pitrone et al., OpenSPIM: an open-access light-sheet microscopy platform, Nature Methods 2013'
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / lightsheet_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
