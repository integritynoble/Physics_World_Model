modality_id: portal_imaging
display_name: Portal Imaging (EPID)
category: Medical Imaging
canonical_dag: Pi --> D
carrier: MV
maturity: M0
forward_model_type: linear_operator
default_solver: back_projection
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: portal_imaging
has_dedicated_operator: true
graph_template_id: portal_imaging_graph_v1
theta:
  n_angles: 180
  pixel_size_um: 50.0
assets: {}
category_module: medical_ct_radon
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: epid_portal_dataset
  dataset_url: https://www.aapm.org/pubs/reports/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Greer, P.B. & van Doorn, T. (2000) Evaluation of a radiographic phantom
    for EPID, Med. Phys.
  license: Research use
mismatch_params:
- name: Isocenter shift
  nominal: 0.0
  range:
  - -2.0
  - 2.0
  unit: mm
- name: Beam energy variation
  nominal: 6.0
  range:
  - 5.8
  - 6.2
  unit: MV
- name: Detector sag
  nominal: 0.0
  range:
  - -1.0
  - 1.0
  unit: mm
- name: Scatter kernel width
  nominal: 5.0
  range:
  - 3.0
  - 7.0
  unit: mm
solvers:
  traditional_cpu:
    name: FBP [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: DL-Recon [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  portal_dl:
    name: PortalDL [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 75
    gpu: false
    reference: Richardson 1972, JOSA
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / portal_imaging_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
