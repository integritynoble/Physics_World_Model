modality_id: raman_imaging
display_name: Raman Imaging / Microscopy
category: Spectroscopy & Spectral Imaging
canonical_dag: M --> R --> D
carrier: Photon
maturity: M0
forward_model_type: nonlinear_operator
default_solver: spectral_unmixing
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: raman_imaging
has_dedicated_operator: true
graph_template_id: raman_imaging_graph_v1
theta:
  density: 0.5
assets: {}
category_module: microscopy_psf
data_source:
  priority:
  - web
  - experimental
  - synthetic_web
  - generated
  dataset_id: raman_dataset
  dataset_url: https://rruff.info/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: RRUFF Project, Univ. Arizona
  license: Public domain
mismatch_params:
- name: Spectral calibration shift
  nominal: 0.0
  range:
  - -2.0
  - 2.0
  unit: cm^-1
- name: Fluorescence background
  nominal: 0.0
  range:
  - 0.0
  - 10.0
  unit: relative
- name: Laser power fluctuation
  nominal: 0.0
  range:
  - 0.0
  - 5.0
  unit: '-'
- name: Cosmic ray artifact
  nominal: 0.0
  range:
  - 0.0
  - 1.0
  unit: '-'
solvers:
  traditional_cpu:
    name: Adjoint
    module: pwm_core.recon.adjoint
    function: run_adjoint
    params: '0'
    gpu: false
    reference: ''
  best_quality:
    name: PnP-ADMM
    module: pwm_core.recon.pnp_admm
    function: pnp_admm_recon
    params: 2M
    gpu: true
    reference: ''
  raman_dl:
    name: RamanNet
    module: pwm_core.recon.raman_solvers
    function: raman_dl_recon
    params: 8M
    gpu: true
    reference: Ho, C.S. et al. (2019) DL for rapid Raman microspectroscopy, Nature
      Comms 10:4927
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: web
    reference: RRUFF Project, Univ. Arizona
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / raman_imaging_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
