modality_id: industrial_ct
display_name: Industrial X-ray CT
category: Industrial Inspection
canonical_dag: Pi --> D
carrier: X-ray
maturity: M0
forward_model_type: linear_operator
default_solver: fbp
tier: A
x_shape:
- 64
- 64
y_shape:
- 64
- 64
operator_id: industrial_ct
has_dedicated_operator: true
graph_template_id: industrial_ct_graph_v1
theta:
  n_angles: 180
  pixel_size_um: 50.0
assets: {}
category_module: medical_ct_radon
data_source:
  priority:
  - experimental
  - synthetic_web
  - generated
  dataset_id: weld_ct_dataset
  dataset_url: https://www.fhg.de/
  fallback: generated
  synthetic_generator: shepp_logan
  citation: Kruth, J.P. et al. (2011) CT for dimensional metrology, CIRP Annals 60(2)
  license: Research use
mismatch_params:
- name: Center of rotation offset
  nominal: 0.0
  range:
  - -2.0
  - 2.0
  unit: px
- name: Source voltage drift
  nominal: 150.0
  range:
  - 145.0
  - 155.0
  unit: kV
- name: Detector tilt
  nominal: 0.0
  range:
  - -0.5
  - 0.5
  unit: deg
- name: Beam hardening coefficient
  nominal: 0.0
  range:
  - 0.0
  - 0.05
  unit: '-'
solvers:
  traditional_cpu:
    name: Adjoint [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 30
    gpu: false
    reference: Richardson 1972, JOSA
  best_quality:
    name: PnP-ADMM [proxy]
    module: pwm_core.recon.richardson_lucy
    function: run_richardson_lucy
    params:
      iters: 150
    gpu: false
    reference: Richardson 1972, JOSA
  ict_dl:
    name: IndustrialCT-Net [proxy]
    module: pwm_core.recon.ct_solvers
    function: run_fbp
    params:
      filter: ram-lak
    gpu: false
    reference: Shepp & Logan 1974
metrics:
  names:
  - psnr
  - ssim
  primary: psnr
  thresholds: {}
reference_psnr: null
expected_psnr_range: null
source_attribution:
  ground_truth:
    type: generated
    reference: Synthetic phantom
  forward_model:
    type: registry
    reference: pwm graph_templates.yaml / industrial_ct_graph_v1
  solver:
    type: registry
    reference: pwm solver_registry.yaml
  mismatch_ranges:
    type: registry
    reference: pwm modality_benchmarks spec
