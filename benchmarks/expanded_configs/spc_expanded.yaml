modality_id: spc
display_name: Single-Pixel Camera (SPC)
category: Compressive Imaging
carrier: Photon
maturity: M3
variants:
  hadamard_spc:
    id: hadamard_spc
    name: Hadamard SPC
    dag: Src -> M(DMD_Hadamard) -> Sigma -> D(photodiode)
    optical_elements:
    - LED source
    - DMD (TI DLP, Hadamard patterns)
    - Collection lens
    - Single photodiode
    reference: Duarte et al., IEEE SPM 2008
  fourier_spc:
    id: fourier_spc
    name: Fourier SPC
    dag: Src -> M(DMD_sinusoidal) -> Sigma -> D(photodiode)
    optical_elements:
    - LED source
    - DMD (sinusoidal fringe patterns)
    - Collection lens
    - Photodiode
    reference: Fourier single-pixel imaging
  gaussian_spc:
    id: gaussian_spc
    name: Gaussian Random SPC
    dag: Src -> M(DMD_random) -> Sigma -> D(photodiode)
    optical_elements:
    - LED source
    - DMD (Gaussian random patterns)
    - Collection lens
    - Photodiode
    reference: CS-theory optimal; RIP guarantee
  hyperspectral_spc:
    id: hyperspectral_spc
    name: Hyperspectral SPC
    dag: Src(broadband) -> M(DMD) -> Sigma -> D(spectrometer)
    optical_elements:
    - Broadband source
    - DMD
    - Collection lens
    - Spectrometer (2048 channels)
    reference: OpenSpyrit SPIHIM
  adaptive_spc:
    id: adaptive_spc
    name: Adaptive SPC
    dag: Src -> M(DMD_wavelet) -> Sigma -> D(photodiode)
    optical_elements:
    - LED source
    - DMD (adaptive wavelet patterns)
    - Collection lens
    - Photodiode
    reference: Rousset et al., IEEE TCI 2017
  ghost_spc:
    id: ghost_spc
    name: Compressive Ghost Imaging
    dag: Src(thermal/SPDC) -> M(correlations) -> Sigma -> D(bucket)
    optical_elements:
    - Thermal/SPDC source
    - Spatial correlations
    - Bucket detector
    reference: Ghost imaging variant
image_sizes:
  small:
    x_shape:
    - 128
    - 128
    label: Small
  standard:
    x_shape:
    - 256
    - 256
    label: Standard
  large:
    x_shape:
    - 512
    - 512
    label: Large
noise_levels:
  clean:
    label: Clean
    snr_db: 60
  low:
    label: Low noise
    snr_db: 40
  medium:
    label: Medium noise
    snr_db: 30
  high:
    label: High noise
    snr_db: 20
mismatch_params:
- name: Gain drift alpha
  nominal: 1.0
  range:
  - 0.8
  - 1.2
  unit: '-'
- name: Measurement noise sigma_y
  nominal: 0.01
  range:
  - 0.0
  - 0.1
  unit: '-'
- name: Pattern error (bit flips)
  nominal: 0.0
  range:
  - 0.0
  - 1.0
  unit: '-'
mismatch_levels:
  M0_nominal:
    description: No mismatch - perfect forward model
    n_params_perturbed: 0
  M1_single:
    description: Single parameter perturbed
    n_params_perturbed: 1
  M2_compound:
    description: 3+ parameters simultaneously perturbed
    n_params_perturbed: 3
  M3_real:
    description: Real calibration/experimental errors
    n_params_perturbed: all
  M4_adversarial:
    description: Worst-case mismatch optimized to max failure
    n_params_perturbed: all
data_sources:
- id: set11
  type: web
  label: WEB
  url: https://github.com/jianzhangcs/SCSNet/tree/master/data/Set11
  citation: 'Kulkarni et al., ReconNet: Non-Iterative Reconstruction of Images from Compressively Sensed Measurements, CVPR
    2016'
  license: Public domain
  applies_to: all_variants
- id: spc_generated
  type: generated
  label: GEN
  description: Synthetically generated spc data
  applies_to: all_variants
total_cases:
  B1: 72
  B2: 360
  B3: 360
  B4: 360
  grand_total: 1152
