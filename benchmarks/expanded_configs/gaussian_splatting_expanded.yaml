modality_id: gaussian_splatting
display_name: 3D Gaussian Splatting (3DGS)
category: Neural Rendering
carrier: Photon
maturity: M0
variants:
  3dgs_original:
    id: 3dgs_original
    name: 3D Gaussian Splatting
    dag: Src(scene) -> M(3D_Gaussians) -> P(diff_rasterizer) -> D(camera)
    optical_elements:
    - Scene
    - 100K-5M 3D Gaussian splats
    - Differentiable tile-based rasterizer
    - Camera
    reference: Kerbl et al., SIGGRAPH 2023
  2dgs:
    id: 2dgs
    name: 2D Gaussian Splatting
    dag: Src(scene) -> M(2D_disk_Gaussians) -> P(diff_rasterizer) -> D(camera)
    optical_elements:
    - Scene
    - 2D disk primitives
    - Rasterizer
    - Camera
    reference: Better surface reconstruction
  scaffold_gs:
    id: scaffold_gs
    name: Scaffold-GS
    dag: Src(scene) -> M(anchor_Gaussians_voxel) -> P(diff_rasterizer) -> D(camera)
    optical_elements:
    - Scene
    - Voxel scaffold + anchor Gaussians
    - Rasterizer
    - Camera
    reference: Compact; fewer Gaussians
  mip_splatting:
    id: mip_splatting
    name: Mip-Splatting
    dag: Src(scene) -> M(3D_Gaussians_smoothed) -> P(diff_rasterizer) -> D(camera)
    optical_elements:
    - Scene
    - 3D Gaussians + 3D smoothing filter
    - Rasterizer
    - Camera
    reference: Anti-aliased
  4dgs:
    id: 4dgs
    name: 4D Gaussian Splatting
    dag: Src(dynamic_scene) -> M(4D_Gaussians) -> P(diff_rasterizer) -> D(camera)
    optical_elements:
    - Dynamic scene
    - 4D Gaussians (space + time)
    - Temporal rasterizer
    - Camera
    reference: Dynamic scenes
image_sizes:
  small:
