modality_id: cacti
display_name: Coded Aperture Compressive Temporal Imaging (CACTI)
category: Compressive Imaging
carrier: Photon
maturity: M3
variants:
  grayscale_cacti:
    id: grayscale_cacti
    name: Grayscale CACTI
    dag: Src -> M(shifting_binary_mask) -> Sigma(temporal) -> D(CCD)
    optical_elements:
    - Scene
    - Binary mask on translation stage
    - CCD sensor
    reference: Llull et al., Optics Express 2013
  color_cacti:
    id: color_cacti
    name: Color CACTI (Bayer)
    dag: Src -> M(shifting_mask) -> Sigma(temporal) -> D(Bayer_CCD)
    optical_elements:
    - Scene
    - Binary mask
    - Bayer CFA
    - CCD sensor
    reference: Color video reconstruction
  dual_mask_cacti:
    id: dual_mask_cacti
    name: Dual-mask CACTI
    dag: Src -> M(mask1) -> M(mask2) -> Sigma -> D
    optical_elements:
    - Scene
    - Mask 1
    - Mask 2 (different plane)
    - CCD sensor
    reference: Additional spatial diversity
  coded_exposure_sci:
    id: coded_exposure_sci
    name: Coded Exposure SCI
    dag: Src -> M(electronic_shutter) -> Sigma -> D
    optical_elements:
    - Scene
    - Electronic shutter modulation (no moving parts)
    - CCD sensor
    reference: No mechanical mask
  spectral_temporal_cacti:
    id: spectral_temporal_cacti
    name: Spectral-temporal CACTI
    dag: Src -> M(mask) -> W(prism) -> Sigma -> D
    optical_elements:
    - Scene
    - Coded mask
    - Disperser (prism)
    - CCD sensor
    reference: Hyperspectral video
image_sizes:
  small:
    x_shape:
    - 128
    - 128
    label: Small
  standard:
    x_shape:
    - 256
    - 256
    label: Standard
  large:
    x_shape:
    - 512
    - 512
    label: Large
noise_levels:
  clean:
    label: Clean
    snr_db: 60
  low:
    label: Low noise
    snr_db: 40
  medium:
    label: Medium noise
    snr_db: 30
  high:
    label: High noise
    snr_db: 20
mismatch_params:
- name: Spatial shift x,y
  nominal: 0.0
  range:
  - -3.0
  - 3.0
  unit: px
- name: Rotation
  nominal: 0.0
  range:
  - -2.0
  - 2.0
  unit: deg
- name: Temporal clock error
  nominal: 0.0
  range:
  - -0.5
  - 0.5
  unit: frame frac
- name: Gain / offset
  nominal: 0.0
  range:
  - 0.9
  - 1.1
  unit: '- / counts'
- name: Frame-dependent gain
  nominal: 1.0
  range:
  - 0.9
  - 1.1
  unit: '-'
mismatch_levels:
  M0_nominal:
    description: No mismatch - perfect forward model
    n_params_perturbed: 0
  M1_single:
    description: Single parameter perturbed
    n_params_perturbed: 1
  M2_compound:
    description: 3+ parameters simultaneously perturbed
    n_params_perturbed: 3
  M3_real:
    description: Real calibration/experimental errors
    n_params_perturbed: all
  M4_adversarial:
    description: Worst-case mismatch optimized to max failure
    n_params_perturbed: all
data_sources:
- id: sci_6gray
  type: web
  label: WEB
  url: https://github.com/liuyang12/SCI/tree/master/data
