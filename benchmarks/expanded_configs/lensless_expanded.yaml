modality_id: lensless
display_name: Lensless (Diffuser Camera) Imaging
category: Computational Photography
carrier: Photon
maturity: M3
variants:
  diffusercam:
    id: diffusercam
    name: DiffuserCam
    dag: Src(scene) -> C(random_diffuser_PSF) -> D(CMOS)
    optical_elements:
    - Scene
    - Polycarbonate diffuser (random PSF)
    - Bare CMOS sensor
    reference: Antipa et al., Optica 2018
  phlatcam:
    id: phlatcam
    name: PhlatCam
    dag: Src(scene) -> C(designed_spiral_phase_mask) -> D(CMOS)
    optical_elements:
    - Scene
    - Optimized spiral phase mask
    - CMOS sensor
    reference: Boominathan et al., IEEE TPAMI 2020
  flatcam:
    id: flatcam
    name: FlatCam/FlatScope
    dag: Src(scene) -> M(binary_amplitude_mask) -> D(CMOS)
    optical_elements:
    - Scene
    - Random binary amplitude mask
    - CMOS (mask-sensor distance ~0)
    reference: Ultra-thin camera
  spectral_diffusercam:
    id: spectral_diffusercam
    name: SpectralDiffuserCam
    dag: Src(scene) -> C(diffuser) -> W(spectral_CFA) -> D(CMOS)
    optical_elements:
    - Scene
    - Diffuser
    - Spectral filter array
    - CMOS
    reference: Hyperspectral single-shot
image_sizes:
  small:
    x_shape:
    - 128
    - 128
    label: Small
  standard:
    x_shape:
    - 256
    - 256
    label: Standard
  large:
    x_shape:
    - 512
    - 512
    label: Large
noise_levels:
  clean:
    label: Clean
    snr_db: 60
  low:
    label: Low noise
    snr_db: 40
  medium:
    label: Medium noise
    snr_db: 30
  high:
    label: High noise
    snr_db: 20
mismatch_params: []
mismatch_levels:
  M0_nominal:
    description: No mismatch - perfect forward model
    n_params_perturbed: 0
  M1_single:
    description: Single parameter perturbed
    n_params_perturbed: 1
  M2_compound:
    description: 3+ parameters simultaneously perturbed
    n_params_perturbed: 3
  M3_real:
    description: Real calibration/experimental errors
    n_params_perturbed: all
  M4_adversarial:
    description: Worst-case mismatch optimized to max failure
    n_params_perturbed: all
data_sources:
- id: diffusercam
  type: web
  label: WEB
  url: https://waller-lab.github.io/LenslessLearning/dataset.html
  citation: Monakhova et al., Learned reconstructions for practical mask-based lensless imaging, Optics Express 2019
  license: BSD-3-Clause
  applies_to: all_variants
- id: lensless_generated
  type: generated
  label: GEN
  description: Synthetically generated lensless data
  applies_to: all_variants
total_cases:
  B1: 48
  B2: 240
  B3: 240
  B4: 240
  grand_total: 768
