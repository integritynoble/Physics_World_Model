modality_id: matrix
display_name: Generic Matrix Sensing
category: Compressive Imaging
carrier: Photon
maturity: M1
variants:
  dense_gaussian:
    id: dense_gaussian
    name: Dense Gaussian Matrix
    dag: Src -> M(dense_gaussian) -> D
    optical_elements:
    - Signal source
    - Dense Gaussian measurement matrix
    - Detector
    reference: CS theory
  sparse_binary:
    id: sparse_binary
    name: Sparse Binary Matrix
    dag: Src -> M(sparse_binary) -> D
    optical_elements:
    - Signal source
    - Sparse 0/1 measurement matrix
    - Detector
    reference: Sparse sensing
  partial_dct:
    id: partial_dct
    name: Structured DCT Matrix
    dag: Src -> M(partial_DCT) -> D
    optical_elements:
    - Signal source
    - Partial DCT measurement matrix
    - Detector
    reference: DCT-based CS
  learned_matrix:
    id: learned_matrix
    name: Learned Matrix
    dag: Src -> M(learned) -> D
    optical_elements:
    - Signal source
    - End-to-end optimized measurement matrix
    - Detector
    reference: Learned CS
image_sizes:
  small:
    x_shape:
    - 128
    - 128
    label: Small
  standard:
    x_shape:
    - 256
    - 256
    label: Standard
  large:
    x_shape:
    - 512
    - 512
    label: Large
noise_levels:
  clean:
    label: Clean
    snr_db: 60
  low:
    label: Low noise
    snr_db: 40
  medium:
    label: Medium noise
    snr_db: 30
  high:
    label: High noise
    snr_db: 20
mismatch_params:
- name: Matrix perturbation
  nominal: 0.0
  range:
  - 0.0
  - 10.0
  unit: A
- name: Condition number change
  nominal: 0.0
  range:
  - 0
  - 0
  unit: '-'
mismatch_levels:
  M0_nominal:
    description: No mismatch - perfect forward model
    n_params_perturbed: 0
  M1_single:
    description: Single parameter perturbed
    n_params_perturbed: 1
  M2_compound:
    description: 3+ parameters simultaneously perturbed
    n_params_perturbed: 3
  M3_real:
    description: Real calibration/experimental errors
    n_params_perturbed: all
  M4_adversarial:
    description: Worst-case mismatch optimized to max failure
    n_params_perturbed: all
data_sources:
- id: shepp_logan_synth
  type: web
  label: WEB
  url: https://github.com/pwm-project/shepp-logan-synth
  citation: Shepp and Logan, The Fourier reconstruction of a head section, IEEE TNS 1974
  license: Public domain
  applies_to: all_variants
- id: matrix_generated
  type: generated
  label: GEN
  description: Synthetically generated matrix data
  applies_to: all_variants
total_cases:
  B1: 48
  B2: 240
  B3: 240
  B4: 240
  grand_total: 768
